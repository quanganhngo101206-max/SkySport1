<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Danh sách mã giảm giá</title>
</head>
<body>
<div th:fragment="content">

    <div class="card-sky">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-tags icon"></i>
                Danh sách mã giảm giá
            </div>
            <div class="card-actions">
                <a th:href="@{/admin/discount-codes/create}" class="btn-sky btn-sky-primary">
                    <i class="fas fa-plus"></i>
                    Tạo mã
                </a>
            </div>
        </div>

        <div class="card-body">
            <div th:if="${#lists.isEmpty(discountCodes)}" class="empty-state">
                <div class="icon"><i class="fas fa-circle-exclamation"></i></div>
                <div class="title">Chưa có mã giảm giá</div>
                <div class="desc">Hãy tạo mã để áp dụng cho đơn hàng.</div>
            </div>

            <div th:if="${!#lists.isEmpty(discountCodes)}">
                <table class="table-sky table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Loại</th>
                        <th>Giá trị</th>
                        <th>Số lượng</th>
                        <th>Trạng thái</th>
                        <th style="width: 180px;">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="dc : ${discountCodes}">
                        <td th:text="${dc.code}">CODE</td>
                        <td th:text="${dc.name}">Tên</td>
                        <td th:text="${T(com.example.skysport1.enums.DiscountType).of(dc.discountType)?.label ?: dc.discountType}">TYPE</td>
                        <td th:text="${dc.discountValue != null ? dc.discountValue : 0}">0</td>
                        <td th:text="${dc.quantity != null ? dc.quantity : '-'}">-</td>
                        <td>
                            <span class="badge-sky primary" th:if="${dc.status != null}">
                                <span th:text="${dc.status == 1 ? 'Hoạt động' : 'Dừng'}">Hoạt động</span>
                            </span>
                            <span class="badge-sky secondary" th:if="${dc.status == null}">
                                —
                            </span>
                        </td>
                        <td>
                            <form th:action="@{/admin/discount-codes/delete/{id}(id=${dc.id})}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        class="btn-sky btn-sky-danger btn-sky-sm"
                                        onclick="return confirm('Xóa mã giảm giá này?')">
                                    <i class="fas fa-trash"></i>
                                    Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
