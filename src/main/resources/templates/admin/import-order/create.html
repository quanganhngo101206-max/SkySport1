<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Tạo phiếu nhập</title>
</head>
<body>
<div th:fragment="content">

    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <button type="button" class="btn-close float-end" data-bs-dismiss="alert"></button>
        <span th:text="${error}"></span>
    </div>

    <div class="card-sky">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-plus icon"></i>
                Tạo phiếu nhập
            </div>
            <div class="card-actions">
                <a th:href="@{/admin/import-orders}" class="btn-sky btn-sky-secondary">
                    ← Quay lại
                </a>
            </div>
        </div>

        <div class="card-body">
            <form th:action="@{/admin/import-orders/create}" method="post" id="importOrderForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-sky-label required">Nhà cung cấp</label>
                        <select class="form-sky" name="supplierId" required>
                            <option value="">-- Chọn supplier --</option>
                            <option th:each="sp : ${suppliers}" th:value="${sp.id}" th:text="${sp.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-sky-label">Ghi chú</label>
                        <input class="form-sky" type="text" name="note" placeholder="(tuỳ chọn)"/>
                    </div>
                </div>

                <div class="mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-sky-label mb-0">Chi tiết hàng nhập</label>
                        <button type="button" class="btn-sky btn-sky-secondary btn-sm" onclick="addRow()">
                            <i class="fas fa-plus"></i> Thêm dòng
                        </button>
                    </div>

                    <table class="table-sky table align-middle" id="detailTable">
                        <thead>
                        <tr>
                            <th style="min-width: 280px;">Biến thể sản phẩm</th>
                            <th style="width: 120px;">Số lượng</th>
                            <th style="width: 160px;">Giá nhập</th>
                            <th style="width: 60px;"></th>
                        </tr>
                        </thead>
                        <tbody id="detailBody"></tbody>
                    </table>

                    <div id="emptyHint" class="empty-state" style="padding: 16px;">
                        <div class="desc">Chưa có dòng nào. Bấm "Thêm dòng" để bắt đầu.</div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn-sky btn-sky-primary">
                        <i class="fas fa-save"></i>
                        Lưu phiếu nhập
                    </button>
                    <a th:href="@{/admin/import-orders}" class="btn-sky btn-sky-secondary">
                        Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- dữ liệu biến thể sản phẩm cho dropdown, render sẵn từ server -->
    <select id="productDetailOptionsTemplate" style="display:none;">
        <option th:each="pd : ${productDetails}"
                th:value="${pd.id}"
                th:text="${pd.product.name + ' - ' + (pd.size != null ? pd.size.name : '') + ' / ' + (pd.color != null ? pd.color.name : '') + ' (' + pd.sku + ')'}">
        </option>
    </select>

</div>
<th:block th:fragment="scripts">
    <script th:inline="javascript">
        let rowIndex = 0;

        function addRow() {
            const tbody = document.getElementById('detailBody');
            const optionsHtml = document.getElementById('productDetailOptionsTemplate').innerHTML;
            const idx = rowIndex++;

            const tr = document.createElement('tr');
            tr.id = 'row-' + idx;
            tr.innerHTML =
                '<td><select class="form-sky" name="productDetailIds" required>' +
                '<option value="">-- Chọn biến thể --</option>' + optionsHtml + '</select></td>' +
                '<td><input class="form-sky" type="number" name="quantities" min="1" value="1" required></td>' +
                '<td><input class="form-sky" type="number" name="importPrices" min="0" step="0.01" required></td>' +
                '<td><button type="button" class="btn-sky btn-sky-danger btn-sm" onclick="removeRow(' + idx + ')">' +
                '<i class="fas fa-trash"></i></button></td>';

            tbody.appendChild(tr);
            document.getElementById('emptyHint').style.display = 'none';
        }

        function removeRow(idx) {
            const row = document.getElementById('row-' + idx);
            if (row) row.remove();
            if (document.getElementById('detailBody').children.length === 0) {
                document.getElementById('emptyHint').style.display = '';
            }
        }

        document.getElementById('importOrderForm').addEventListener('submit', function (e) {
            if (document.getElementById('detailBody').children.length === 0) {
                e.preventDefault();
                alert('Vui lòng thêm ít nhất 1 dòng hàng nhập trước khi lưu.');
            }
        });

        // tạo sẵn 1 dòng để người dùng nhập ngay
        addRow();
    </script>
</th:block>
</body>
</html>
