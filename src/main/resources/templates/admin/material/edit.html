<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <span th:text="${error}"></span>
    </div>

    <div class="card card-primary">
        <div class="card-header">
            <h3 class="card-title">Sửa chất liệu: <strong th:text="${material.name}"></strong></h3>
        </div>

        <form th:action="@{/admin/materials/update}" th:object="${material}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>

            <div class="card-body">
                <div class="form-group">
                    <label for="name">Tên chất liệu <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           placeholder="Nhập tên chất liệu" required>
                    <span th:errors="*{name}" class="text-danger"></span>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="description">Mô tả</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                    <span th:errors="*{description}" class="text-danger"></span>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="status">Trạng thái</label>
                    <select class="form-control" id="status" th:field="*{status}">
                        <option value="1">Hoạt động</option>
                        <option value="0">Không hoạt động</option>
                    </select>
                </div>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-primary">Cập nhật</button>
                <a th:href="@{/admin/materials}" class="btn btn-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>

<th:block th:fragment="scripts"></th:block>
</body>
</html>
