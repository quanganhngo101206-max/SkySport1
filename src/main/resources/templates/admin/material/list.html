<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">

    <div class="card-sky" style="max-width:1100px;">
        <div class="card-header">
            <h3 class="card-title"><span class="icon"><i class="fas fa-layer-group"></i></span>Danh sách chất liệu</h3>
            <div class="card-actions">
                <button type="button" class="btn-sky btn-sky-primary btn-sky-sm" data-bs-toggle="modal" data-bs-target="#materialModal">
                    <i class="fas fa-plus"></i> Thêm chất liệu
                </button>
            </div>
        </div>
        <div class="card-body">
            <table id="materialTable" class="table-sky">
                <thead><tr>
                    <th>ID</th><th>Tên chất liệu</th><th>Mô tả</th><th>Trạng thái</th><th style="width:100px;">Hành động</th>
                </tr></thead>
                <tbody>
                <tr th:each="material : ${materials}">
                    <td th:text="${material.id}">MAT001</td>
                    <td th:text="${material.name}">Cotton</td>
                    <td th:text="${material.description}">Chất liệu cotton</td>
                    <td>
                        <span class="badge-sky" th:classappend="${material.status == 1 ? 'success' : 'danger'}">
                            <span th:if="${material.status == 1}">Hoạt động</span>
                            <span th:if="${material.status != 1}">Không hoạt động</span>
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/admin/materials/edit/{id}(id=${material.id})}" class="action-btn warning" style="color:#ffc107;">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/materials/delete/{id}(id=${material.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="action-btn danger" style="color:#e63030;" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa chất liệu -->
<div class="modal fade" id="materialModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);">
            <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
                <h5 class="modal-title" style="color:var(--text-primary);">Thêm chất liệu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="materialForm" th:action="@{/admin/materials/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <input type="hidden" id="materialId" name="id">
                    <div class="mb-3">
                        <label class="form-sky-label required">Tên chất liệu</label>
                        <input type="text" class="form-sky" id="materialName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Mô tả</label>
                        <textarea class="form-sky" id="materialDescription" name="description" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Trạng thái</label>
                        <select class="form-sky" id="materialStatus" name="status">
                            <option value="1">Hoạt động</option>
                            <option value="0">Không hoạt động</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid var(--border-color);">
                    <button type="button" class="btn-sky btn-sky-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn-sky btn-sky-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initDataTable('#materialTable');
    });
</script>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
