<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Tạo sản phẩm</title>
</head>
<body>

<div class="content-header mb-2">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1 class="m-0">Tạo sản phẩm</h1>
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card card-primary">
      <div class="card-header">
        <h3 class="card-title">Thông tin sản phẩm</h3>
      </div>

      <form th:action="@{/admin/products/save}" th:object="${product}" method="post"
            enctype="multipart/form-data">
        <div class="card-body">

          <div class="form-group">
            <label for="name">Tên sản phẩm</label>
            <input id="name" type="text" class="form-control" th:field="*{name}"/>
          </div>

          <div class="form-group">
            <label for="description">Mô tả</label>
            <textarea id="description" class="form-control" rows="4" th:field="*{description}"></textarea>
          </div>

          <!-- gender/status -->
          <div class="form-group">
            <label for="gender">Giới tính</label>
            <select id="gender" class="form-control" th:field="*{gender}">
              <option value="1">Nam</option>
              <option value="2">Nữ</option>
              <option value="3">Unisex</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Trạng thái</label>
            <select id="status" class="form-control" th:field="*{status}">
              <option value="0">Ngừng bán</option>
              <option value="1">Đang bán</option>
              <option value="2">Hết hàng</option>
            </select>
          </div>

          <!-- ManyToOne selects -->
          <div class="form-group">
            <label for="brand">Hãng</label>
            <select id="brand" class="form-control" th:field="*{brand}">
              <option value="">-- Chọn hãng --</option>
              <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Danh mục</label>
            <select id="category" class="form-control" th:field="*{category}">
              <option value="">-- Chọn danh mục --</option>
              <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
          </div>

          <div class="form-group">
            <label for="material">Chất liệu</label>
            <select id="material" class="form-control" th:field="*{material}">
              <option value="">-- Chọn chất liệu --</option>
              <option th:each="m : ${materials}" th:value="${m.id}" th:text="${m.name}"></option>
            </select>
          </div>

          <hr/>

          <h4 class="mb-3">Upload ảnh sản phẩm</h4>

          <div class="form-group">
            <label for="images">Chọn ảnh (nhiều ảnh)</label>
            <input id="images" name="images" type="file" class="form-control" multiple accept="image/*"/>
            <small class="text-muted">Ảnh đầu tiên có thể được dùng làm thumbnail theo logic service.</small>
          </div>

          <div class="form-group">
            <label for="thumbnailIndex">Chọn thumbnail (index bắt đầu từ 0, áp dụng cho ảnh vừa upload)</label>
            <input id="thumbnailIndex" name="thumbnailIndex" type="number" class="form-control" min="0" step="1"/>
          </div>

        </div>

        <div class="card-footer">
          <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
          <a th:href="@{/admin/products}" class="btn btn-secondary ml-2">Hủy</a>
        </div>
      </form>

    </div>
  </div>
</section>

</body>
</html>
