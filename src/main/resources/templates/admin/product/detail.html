<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert-sky alert-sky-success">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert-sky alert-sky-danger">
        <span th:text="${error}"></span>
    </div>

    <!-- Thông tin sản phẩm -->
    <div class="card-sky mb-3">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-layer-group icon"></i>
                Biến thể: <strong th:text="${product.name}">Tên sản phẩm</strong>
            </div>
            <div class="card-actions">
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn-sky btn-sky-warning btn-sky-sm">
                    <i class="fas fa-edit"></i> Sửa sản phẩm
                </a>
                <a th:href="@{/admin/products/list}" class="btn-sky btn-sky-secondary btn-sky-sm">
                    ← Quay lại
                </a>
            </div>
        </div>
    </div>

    <!-- Form thêm biến thể -->
    <div class="card-sky mb-3">
        <div class="card-header">
            <div class="card-title"><i class="fas fa-plus icon"></i> Thêm biến thể mới</div>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/products/{id}/details/save(id=${product.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-sky-label required">Size</label>
                        <select class="form-sky" name="size.id" required>
                            <option value="">-- Size --</option>
                            <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-sky-label required">Màu</label>
                        <select class="form-sky" name="color.id" required>
                            <option value="">-- Màu --</option>
                            <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-sky-label required">Giá</label>
                        <input type="number" class="form-sky" name="price" min="0" step="1000" required placeholder="VD: 250000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-sky-label">Giá vốn</label>
                        <input type="number" class="form-sky" name="costPrice" min="0" step="1000" placeholder="VD: 150000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-sky-label">Số lượng</label>
                        <input type="number" class="form-sky" name="quantity" min="0" value="0">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn-sky btn-sky-primary w-100">
                            <i class="fas fa-plus"></i> Thêm
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Danh sách biến thể -->
    <div class="card-sky">
        <div class="card-header">
            <div class="card-title"><i class="fas fa-list icon"></i> Danh sách biến thể</div>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(details)}" class="empty-state">
                <div class="icon"><i class="fas fa-shoe-prints"></i></div>
                <div class="title">Chưa có biến thể nào</div>
                <div class="desc">Thêm biến thể (size / màu) ở form phía trên.</div>
            </div>

            <!-- Mục 17: mỗi size 1 bảng con riêng, có tiêu đề rõ ràng -->
            <div th:if="${!#lists.isEmpty(details)}">
                <div th:each="sizeGroup : ${groupedBySize}" style="margin-bottom:1.5rem;">
                    <div style="padding:.7rem 1.2rem;background:var(--bg-secondary,#f8f9fa);font-weight:600;
                                border-top:1px solid var(--border-color,#eee);border-bottom:1px solid var(--border-color,#eee);">
                        <i class="fas fa-ruler icon" style="margin-right:6px;"></i>
                        Size: <span th:text="${sizeGroup.key}">M</span>
                        <span style="font-weight:400;color:var(--text-muted);font-size:.85rem;"
                              th:text="'(' + ${#lists.size(sizeGroup.value)} + ' biến thể)'"></span>
                    </div>
                    <div class="table-responsive">
                        <table class="table-sky">
                            <thead>
                            <tr>
                                <th>Màu</th>
                                <th>Giá bán</th>
                                <th>Giá vốn</th>
                                <th>Số lượng</th>
                                <th>Trạng thái</th>
                                <th style="width:100px;">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="detail : ${sizeGroup.value}">
                                <td>
                                    <span th:if="${detail.color != null}">
                                        <span class="me-1"
                                              th:style="'display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;background-color:' + ${detail.color.hexCode}"></span>
                                        <span th:text="${detail.color.name}">Đen</span>
                                    </span>
                                    <span th:if="${detail.color == null}">-</span>
                                </td>
                                <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                                <td th:text="${detail.costPrice != null ? #numbers.formatDecimal(detail.costPrice, 0, 'COMMA', 0, 'POINT') + 'đ' : '-'}">-</td>
                                <td th:text="${detail.quantity}">0</td>
                                <td>
                                    <span class="badge-sky" th:classappend="${detail.status == 1 ? 'success' : 'danger'}">
                                        <span th:if="${detail.status == 1}">Hoạt động</span>
                                        <span th:if="${detail.status != 1}">Dừng</span>
                                    </span>
                                </td>
                                <td>
                                    <button class="action-btn warning" data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal' + ${detail.id}"
                                            th:data-id="${detail.id}" title="Sửa">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <form th:action="@{/admin/products/{pid}/details/{did}/delete(pid=${product.id}, did=${detail.id})}"
                                          method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="action-btn danger" title="Xóa"
                                                onclick="return confirm('Xóa biến thể này?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>

                                    <!-- Modal sửa biến thể -->
                                    <div class="modal fade" th:id="'editModal' + ${detail.id}" tabindex="-1">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Sửa biến thể</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <form th:action="@{/admin/products/{pid}/details/{did}/update(pid=${product.id}, did=${detail.id})}"
                                                      method="post">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-sky-label">Size</label>
                                                            <select class="form-sky" name="size.id">
                                                                <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.name}"
                                                                        th:selected="${detail.size != null and detail.size.id == s.id}"></option>
                                                            </select>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-sky-label">Màu</label>
                                                            <select class="form-sky" name="color.id">
                                                                <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.name}"
                                                                        th:selected="${detail.color != null and detail.color.id == c.id}"></option>
                                                            </select>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-sky-label required">Giá bán</label>
                                                            <input type="number" class="form-sky" name="price"
                                                                   th:value="${detail.price}" min="0" step="1000" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-sky-label">Giá vốn</label>
                                                            <input type="number" class="form-sky" name="costPrice"
                                                                   th:value="${detail.costPrice}" min="0" step="1000">
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-sky-label">Số lượng</label>
                                                            <input type="number" class="form-sky" name="quantity"
                                                                   th:value="${detail.quantity}" min="0">
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-sky-label">Trạng thái</label>
                                                            <select class="form-sky" name="status">
                                                                <option value="1" th:selected="${detail.status == 1}">Hoạt động</option>
                                                                <option value="0" th:selected="${detail.status == 0}">Dừng</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn-sky btn-sky-secondary" data-bs-dismiss="modal">Đóng</button>
                                                        <button type="submit" class="btn-sky btn-sky-primary">Cập nhật</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
