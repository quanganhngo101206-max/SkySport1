<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <span th:text="${error}"></span>
    </div>

    <!-- Thông tin sản phẩm -->
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0">
                Biến thể: <strong th:text="${product.name}">Tên sản phẩm</strong>
            </h3>
            <div>
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-warning btn-sm me-1">
                    <i class="fas fa-edit"></i> Sửa sản phẩm
                </a>
                <a th:href="@{/admin/products/list}" class="btn btn-secondary btn-sm">
                    ← Quay lại
                </a>
            </div>
        </div>
    </div>

    <!-- Form thêm biến thể -->
    <div class="card mb-3">
        <div class="card-header">
            <h5 class="card-title mb-0"><i class="fas fa-plus"></i> Thêm biến thể mới</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/products/{id}/details/save(id=${product.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">Size <span class="text-danger">*</span></label>
                        <select class="form-select" name="size.id" required>
                            <option value="">-- Size --</option>
                            <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Màu <span class="text-danger">*</span></label>
                        <select class="form-select" name="color.id" required>
                            <option value="">-- Màu --</option>
                            <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Giá <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" name="price" min="0" step="1000" required placeholder="VD: 250000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Giá vốn</label>
                        <input type="number" class="form-control" name="costPrice" min="0" step="1000" placeholder="VD: 150000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Số lượng</label>
                        <input type="number" class="form-control" name="quantity" min="0" value="0">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-plus"></i> Thêm
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Danh sách biến thể -->
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Danh sách biến thể</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-striped mb-0">
                <thead>
                <tr>
                    <th>Size</th>
                    <th>Màu</th>
                    <th>Giá bán</th>
                    <th>Giá vốn</th>
                    <th>Số lượng</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detail : ${details}">
                    <td th:text="${detail.size != null ? detail.size.name : '-'}">M</td>
                    <td>
                        <span th:if="${detail.color != null}">
                            <span class="me-1"
                                  style="display:inline-block; width:16px; height:16px; border-radius:50%; vertical-align:middle;"
                                  th:style="'display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;background-color:' + ${detail.color.hexCode}"></span>
                            <span th:text="${detail.color.name}">Đen</span>
                        </span>
                        <span th:if="${detail.color == null}">-</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                    <td th:text="${detail.costPrice != null ? #numbers.formatDecimal(detail.costPrice, 0, 'COMMA', 0, 'POINT') + 'đ' : '-'}">-</td>
                    <td th:text="${detail.quantity}">0</td>
                    <td>
                        <span class="badge" th:classappend="${detail.status == 1 ? 'bg-success' : 'bg-danger'}">
                            <span th:if="${detail.status == 1}">Hoạt động</span>
                            <span th:if="${detail.status != 1}">Dừng</span>
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal"
                                th:data-bs-target="'#editModal' + ${detail.id}"
                                th:data-id="${detail.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <form th:action="@{/admin/products/{pid}/details/{did}/delete(pid=${product.id}, did=${detail.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Xóa biến thể này?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>

                        <!-- Modal sửa biến thể -->
                        <div class="modal fade" th:id="'editModal' + ${detail.id}" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Sửa biến thể</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <form th:action="@{/admin/products/{pid}/details/{did}/update(pid=${product.id}, did=${detail.id})}"
                                          method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label class="form-label">Size</label>
                                                <select class="form-select" name="size.id">
                                                    <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.name}"
                                                            th:selected="${detail.size != null and detail.size.id == s.id}"></option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Màu</label>
                                                <select class="form-select" name="color.id">
                                                    <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.name}"
                                                            th:selected="${detail.color != null and detail.color.id == c.id}"></option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Giá bán <span class="text-danger">*</span></label>
                                                <input type="number" class="form-control" name="price"
                                                       th:value="${detail.price}" min="0" step="1000" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Giá vốn</label>
                                                <input type="number" class="form-control" name="costPrice"
                                                       th:value="${detail.costPrice}" min="0" step="1000">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Số lượng</label>
                                                <input type="number" class="form-control" name="quantity"
                                                       th:value="${detail.quantity}" min="0">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Trạng thái</label>
                                                <select class="form-select" name="status">
                                                    <option value="1" th:selected="${detail.status == 1}">Hoạt động</option>
                                                    <option value="0" th:selected="${detail.status == 0}">Dừng</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                            <button type="submit" class="btn btn-primary">Cập nhật</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(details)}">
                    <td colspan="7" class="text-center text-muted py-3">Chưa có biến thể nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
