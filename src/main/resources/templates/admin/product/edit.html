<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <title>Sửa sản phẩm</title>
  <meta charset="UTF-8"/>
</head>
<body>

<div th:fragment="content">
  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title">
        <i class="fas fa-edit icon"></i>
        Sửa sản phẩm: <strong th:text="${product.name}"></strong>
      </h3>
      <div class="card-actions">
        <a th:href="@{/admin/products/list}" class="btn btn-secondary">← Quay lại</a>
      </div>
    </div>

    <form th:action="@{/admin/products/{id}/update(id=${product.id})}"
          th:object="${product}"
          method="post">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="card-body">

        <div class="row" style="display:flex;gap:16px;flex-wrap:wrap;">
          <div style="flex:1;min-width:260px;">
            <label for="name">Tên sản phẩm</label>
            <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="Nhập tên sản phẩm"/>
            <span th:errors="*{name}" style="color:#d63384;font-size:12px;"></span>
          </div>

          <div style="flex:1;min-width:260px;">
            <label for="slug">Slug</label>
            <input type="text" id="slug" class="form-control" th:field="*{slug}" placeholder="URL-friendly"/>
            <span th:errors="*{slug}" style="color:#d63384;font-size:12px;"></span>
          </div>
        </div>

        <div style="margin-top:12px;">
          <label for="description">Mô tả</label>
          <textarea id="description" class="form-control" th:field="*{description}" rows="4"></textarea>
          <span th:errors="*{description}" style="color:#d63384;font-size:12px;"></span>
        </div>

        <div class="row" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">
          <div style="flex:1;min-width:240px;">
            <label for="brand">Thương hiệu</label>
            <select id="brand" class="form-control" name="brand.id">
              <option value="">-- Chọn thương hiệu --</option>
              <option th:each="b : ${brands}"
                      th:value="${b.id}"
                      th:text="${b.name}"
                      th:selected="${product.brand != null and product.brand.id == b.id}">
              </option>
            </select>
          </div>

          <div style="flex:1;min-width:240px;">
            <label for="category">Danh mục</label>
            <select id="category" class="form-control" name="category.id">
              <option value="">-- Chọn danh mục --</option>
              <option th:each="c : ${categories}"
                      th:value="${c.id}"
                      th:text="${c.name}"
                      th:selected="${product.category != null and product.category.id == c.id}">
              </option>
            </select>
          </div>

          <div style="flex:1;min-width:240px;">
            <label for="material">Chất liệu</label>
            <select id="material" class="form-control" name="material.id">
              <option value="">-- Chọn chất liệu --</option>
              <option th:each="m : ${materials}"
                      th:value="${m.id}"
                      th:text="${m.name}"
                      th:selected="${product.material != null and product.material.id == m.id}">
              </option>
            </select>
          </div>
        </div>

        <div class="row" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">
          <div style="flex:1;min-width:240px;">
            <label for="gender">Giới tính</label>
            <select id="gender" class="form-control" th:field="*{gender}">
              <option value="1">Nam</option>
              <option value="2">Nữ</option>
              <option value="3">Unisex</option>
            </select>
          </div>

          <div style="flex:1;min-width:240px;">
            <label for="status">Trạng thái</label>
            <select id="status" class="form-control" th:field="*{status}">
              <option value="0">Ngừng bán</option>
              <option value="1">Đang bán</option>
              <option value="2">Hết hàng</option>
            </select>
          </div>
        </div>

      </div>

      <div class="card-footer" style="margin-top:12px;display:flex;gap:12px;">
        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <a th:href="@{/admin/products/list}" class="btn btn-secondary">Hủy</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
