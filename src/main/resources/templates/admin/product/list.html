<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">
    <div th:if="${success}" class="alert-sky alert-sky-success">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert-sky alert-sky-danger">
        <span th:text="${error}"></span>
    </div>

    <div class="card-sky">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-tshirt icon"></i>
                <span th:text="${title}">Danh sách sản phẩm</span>
            </div>
            <div class="card-actions">
                <a th:href="@{/admin/products/create}" class="btn-sky btn-sky-primary">
                    <i class="fas fa-plus"></i> Thêm sản phẩm
                </a>
            </div>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/products/list}" method="get" class="row g-2 mb-3">
                <div class="col-auto">
                    <input type="text" name="keyword" class="form-sky" style="width:220px;" placeholder="Tìm theo tên sản phẩm..."
                           th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <select name="brandId" class="form-sky" onchange="this.form.submit()">
                        <option value="">-- Tất cả thương hiệu --</option>
                        <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"
                                th:selected="${brand.id == brandId}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <select name="categoryId" class="form-sky" onchange="this.form.submit()">
                        <option value="">-- Tất cả danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id == categoryId}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn-sky btn-sky-secondary"><i class="fas fa-search"></i> Lọc</button>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                <div class="icon"><i class="fas fa-box-open"></i></div>
                <div class="title">Chưa có sản phẩm</div>
                <div class="desc">Hãy thêm sản phẩm mới để bắt đầu bán hàng.</div>
            </div>

            <div th:if="${!#lists.isEmpty(products)}" class="table-responsive">
                <table id="productTable" class="table-sky">
                    <thead>
                    <tr>
                        <th style="width:64px;">Ảnh</th>
                        <th>ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Thương hiệu</th>
                        <th>Danh mục</th>
                        <th>Giới tính</th>
                        <th>Trạng thái</th>
                        <th style="width:140px;">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td>
                            <img th:if="${thumbnails.get(product.id)} != null" th:src="${thumbnails.get(product.id)}"
                                 alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px;"/>
                            <i th:unless="${thumbnails.get(product.id)} != null" class="fas fa-tshirt"
                               style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;
                                      border-radius:6px;background:var(--bg-hover);color:var(--text-muted);"></i>
                        </td>
                        <td th:text="${product.id}">SP001</td>
                        <td th:text="${product.name}">Tên sản phẩm</td>
                        <td th:text="${product.brand?.name}">Nike</td>
                        <td th:text="${product.category?.name}">Giày</td>
                        <td>
                            <span th:if="${product.gender == 1}">Nam</span>
                            <span th:if="${product.gender == 2}">Nữ</span>
                            <span th:if="${product.gender == 3 or product.gender == null}">Unisex</span>
                        </td>
                        <td>
                            <span class="badge-sky" th:classappend="${product.status == 1 ? 'success' : 'danger'}">
                                <span th:if="${product.status == 1}">Hoạt động</span>
                                <span th:if="${product.status != 1}">Không hoạt động</span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/admin/products/{id}/details(id=${product.id})}"
                               class="action-btn info" title="Chi tiết phân loại">
                                <i class="fas fa-list"></i>
                            </a>
                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                               class="action-btn warning" title="Sửa">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                                  style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="action-btn danger"
                                        onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')" title="Xóa">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:fragment="scripts">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('productTable')) {
                initDataTable('#productTable');
            }
        });
    </script>
</th:block>
</body>
</html>
