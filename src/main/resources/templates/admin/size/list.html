<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">

    <div class="card-sky" style="max-width:900px;">
        <div class="card-header">
            <h3 class="card-title"><span class="icon"><i class="fas fa-ruler"></i></span>Danh sách kích cỡ</h3>
            <div class="card-actions">
                <button type="button" class="btn-sky btn-sky-primary btn-sky-sm" data-bs-toggle="modal" data-bs-target="#sizeModal">
                    <i class="fas fa-plus"></i> Thêm kích cỡ
                </button>
            </div>
        </div>
        <div class="card-body">
            <table id="sizeTable" class="table-sky">
                <thead><tr>
                    <th>ID</th><th>Tên kích cỡ</th><th>Trạng thái</th><th style="width:100px;">Hành động</th>
                </tr></thead>
                <tbody>
                <tr th:each="size : ${sizes}">
                    <td th:text="${size.id}">SIZE001</td>
                    <td th:text="${size.name}">M</td>
                    <td>
                        <span class="badge-sky" th:classappend="${size.status == 1 ? 'success' : 'danger'}">
                            <span th:if="${size.status == 1}">Hoạt động</span>
                            <span th:if="${size.status != 1}">Không hoạt động</span>
                        </span>
                    </td>
                    <td>
                        <button class="action-btn warning" style="color:#ffc107;" data-bs-toggle="modal" data-bs-target="#sizeModal"
                                th:data-id="${size.id}" th:data-name="${size.name}" th:data-status="${size.status}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <form th:action="@{/admin/sizes/delete/{id}(id=${size.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="action-btn danger" style="color:#e63030;" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa kích cỡ -->
<div class="modal fade" id="sizeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);">
            <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
                <h5 class="modal-title" style="color:var(--text-primary);">Thêm kích cỡ</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="sizeForm" th:action="@{/admin/sizes/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <input type="hidden" id="sizeId" name="id">
                    <div class="mb-3">
                        <label class="form-sky-label required">Tên kích cỡ</label>
                        <input type="text" class="form-sky" id="sizeName" name="name" required placeholder="VD: S, M, L, XL">
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Trạng thái</label>
                        <select class="form-sky" id="sizeStatus" name="status">
                            <option value="1">Hoạt động</option>
                            <option value="0">Không hoạt động</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid var(--border-color);">
                    <button type="button" class="btn-sky btn-sky-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn-sky btn-sky-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById('sizeModal').addEventListener('show.bs.modal', function(e) {
        var btn = e.relatedTarget, id = btn.getAttribute('data-id'), m = this;
        if (id) {
            m.querySelector('.modal-title').textContent = 'Sửa kích cỡ';
            m.querySelector('#sizeId').value = id;
            m.querySelector('#sizeName').value = btn.getAttribute('data-name');
            m.querySelector('#sizeStatus').value = btn.getAttribute('data-status');
            m.querySelector('#sizeForm').action = '/admin/sizes/update';
        } else {
            m.querySelector('.modal-title').textContent = 'Thêm kích cỡ';
            m.querySelector('#sizeId').value = '';
            m.querySelector('#sizeName').value = '';
            m.querySelector('#sizeStatus').value = '1';
            m.querySelector('#sizeForm').action = '/admin/sizes/save';
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        initDataTable('#sizeTable');
    });
</script>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
