<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">
    <div class="card-sky" style="max-width:1000px;">
        <div class="card-header">
            <h3 class="card-title">
                <span class="icon"><i class="fas fa-user-edit"></i></span>
                Sửa nhân viên: <strong th:text="${staffRequest.fullName}"></strong>
            </h3>
            <div class="card-actions">
                <a th:href="@{/admin/staffs}" class="btn-sky btn-sky-secondary btn-sky-sm">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </a>
            </div>
        </div>
        <form th:action="@{/admin/staffs/update}" th:object="${staffRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="card-body">
                <div th:if="${errors}" class="alert alert-danger">
                    <ul style="margin-bottom:0;">
                        <li th:each="err : ${errors}" th:text="${err.defaultMessage}"></li>
                    </ul>
                </div>
                <input type="hidden" name="id" th:value="${staffRequest.id}">
                <div class="row g-3">
                    <!-- Thông tin nhân viên -->
                    <div class="col-md-6">
                        <h6 style="color:var(--primary); font-weight:700; margin-bottom:1rem; padding-bottom:.5rem; border-bottom:1px solid var(--border-color);">
                            <i class="fas fa-id-card me-2"></i>Thông tin nhân viên
                        </h6>
                        <div class="mb-3">
                            <label class="form-sky-label required">Họ tên</label>
                            <input type="text" class="form-sky" id="fullName" name="fullName"
                                   th:value="${staffRequest.fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label required">Số điện thoại</label>
                            <input type="text" class="form-sky" id="phone" name="phone"
                                   th:value="${staffRequest.phone}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label">Email</label>
                            <input type="email" class="form-sky" id="email" name="email"
                                   th:value="${staffRequest.email}">
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label">Giới tính</label>
                            <select class="form-sky" id="gender" name="gender">
                                <option value="">Chưa xác định</option>
                                <option value="true" th:selected="${staffRequest.gender == true}">Nam</option>
                                <option value="false" th:selected="${staffRequest.gender == false}">Nữ</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label">Ngày sinh</label>
                            <input type="date" class="form-sky" id="dob" name="dob"
                                   th:value="${staffRequest.dob}">
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label">Địa chỉ</label>
                            <input type="text" class="form-sky" id="address" name="address"
                                   th:value="${staffRequest.address}">
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label">Trạng thái</label>
                            <select class="form-sky" id="status" name="status">
                                <option value="1" th:selected="${staffRequest.status == 1}">Đang làm</option>
                                <option value="0" th:selected="${staffRequest.status == 0}">Nghỉ việc</option>
                            </select>
                        </div>
                    </div>

                    <!-- Thông tin tài khoản -->
                    <div class="col-md-6">
                        <h6 style="color:var(--primary); font-weight:700; margin-bottom:1rem; padding-bottom:.5rem; border-bottom:1px solid var(--border-color);">
                            <i class="fas fa-key me-2"></i>Thông tin tài khoản
                        </h6>
                        <div class="mb-3">
                            <label class="form-sky-label">Tên đăng nhập</label>
                            <input type="text" class="form-sky" id="username"
                                   th:value="${staffRequest.username}" disabled
                                   style="opacity:.6; cursor:not-allowed;">
                            <small style="color:var(--text-muted); font-size:.8rem;">Không thể thay đổi tên đăng nhập</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer" style="border-top:1px solid var(--border-color); padding:1.2rem 1.5rem; display:flex; gap:.75rem;">
                <button type="submit" class="btn-sky btn-sky-primary">
                    <i class="fas fa-save"></i> Cập nhật
                </button>
                <a th:href="@{/admin/staffs}" class="btn-sky btn-sky-secondary">Hủy</a>
            </div>
        </form>
    </div>

    <!-- Đổi mật khẩu — FORM RIÊNG, endpoint riêng, để không thể vô tình
         đổi mật khẩu người khác khi chỉ sửa thông tin cơ bản -->
    <div class="card-sky mt-4" style="max-width:1000px;">
        <div class="card-header">
            <h3 class="card-title">
                <span class="icon"><i class="fas fa-lock"></i></span>
                Đổi mật khẩu
            </h3>
        </div>
        <form th:action="@{/admin/staffs/{id}/change-password(id=${staffRequest.id})}" method="post"
              onsubmit="return confirm('Đổi mật khẩu nhân viên này? Nhân viên sẽ cần dùng mật khẩu mới ở lần đăng nhập tiếp theo.')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-sky-label required">Mật khẩu mới</label>
                        <input type="password" class="form-sky" name="newPassword"
                               placeholder="Ít nhất 6 ký tự" minlength="6" required>
                    </div>
                </div>
            </div>
            <div class="card-footer" style="border-top:1px solid var(--border-color); padding:1.2rem 1.5rem;">
                <button type="submit" class="btn-sky btn-sky-warning">
                    <i class="fas fa-key"></i> Đổi mật khẩu
                </button>
            </div>
        </form>
    </div>
</div>
<th:block th:replace="~{${pageContent} :: scripts}"></th:block>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
