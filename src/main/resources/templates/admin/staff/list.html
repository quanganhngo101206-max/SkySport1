<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">
    <div class="card-sky">
        <div class="card-header">
            <h3 class="card-title"><span class="icon"><i class="fas fa-user-tie"></i></span>Danh sách nhân viên</h3>
            <div class="card-actions">
                <a th:href="@{/admin/staffs/create}" class="btn-sky btn-sky-primary btn-sky-sm">
                    <i class="fas fa-plus"></i> Thêm nhân viên
                </a>
            </div>
        </div>
        <div class="card-body">
            <table id="staffTable" class="table-sky">
                <thead><tr>
                    <th>ID</th><th>Họ tên</th><th>Email</th><th>Số điện thoại</th>
                    <th>Giới tính</th><th>Trạng thái</th><th style="width:100px;">Hành động</th>
                </tr></thead>
                <tbody>
                <tr th:each="staff : ${staffs}">
                    <td th:text="${staff.id}">NV001</td>
                    <td th:text="${staff.fullName}">Nguyễn Văn A</td>
                    <td th:text="${staff.email}">staff@example.com</td>
                    <td th:text="${staff.phone}">0123456789</td>
                    <td>
                        <span th:if="${staff.gender == true}">Nam</span>
                        <span th:if="${staff.gender == false}">Nữ</span>
                        <span th:if="${staff.gender == null}" style="color:var(--text-muted);">—</span>
                    </td>
                    <td>
                        <span class="badge-sky" th:classappend="${staff.status == 1 ? 'success' : 'danger'}">
                            <span th:if="${staff.status == 1}">Đang làm</span>
                            <span th:if="${staff.status != 1}">Nghỉ việc</span>
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/admin/staffs/edit/{id}(id=${staff.id})}" class="action-btn warning" style="color:#ffc107;">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/staffs/delete/{id}(id=${staff.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="action-btn danger" style="color:#e63030;" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initDataTable('#staffTable');
    });
</script>
<th:block th:replace="~{${pageContent} :: scripts}"></th:block>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
