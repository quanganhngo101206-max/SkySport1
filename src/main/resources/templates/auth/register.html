<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - SkySport</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .register-container .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .register-container .logo h1 {
            font-size: 32px;
            font-weight: 900;
            color: #e63030;
            letter-spacing: -1px;
        }
        .register-container .logo h1 span { color: #ffffff; }
        .register-container .logo .sub {
            color: #6b6b6b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }
        .register-container .title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .register-container .subtitle {
            color: #6b6b6b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b6b6b;
            font-size: 15px;
        }
        .form-group .input-wrapper input {
            width: 100%;
            padding: 11px 14px 11px 44px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: #e63030;
            box-shadow: 0 0 0 3px rgba(230, 48, 48, 0.15);
        }
        .form-group .input-wrapper input::placeholder { color: #6b6b6b; }
        .form-group .error-text {
            color: #e63030;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: #e63030;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .btn-register:hover {
            background: #c82020;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(230, 48, 48, 0.3);
        }
        .alert-sky {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-sky-danger {
            background: rgba(230, 48, 48, 0.1);
            border: 1px solid rgba(230, 48, 48, 0.2);
            color: #e63030;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
            color: #6b6b6b;
            font-size: 13px;
        }
        .back-link a {
            color: #6b6b6b;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link a:hover { color: #e63030; }
        .divider {
            border: none;
            border-top: 1px solid #2a2a2a;
            margin: 18px 0;
        }
        @media (max-width: 480px) {
            .register-container { padding: 28px 16px; }
        }
    </style>
</head>

<body>
<div class="register-container">
    <!-- Logo -->
    <div class="logo">
        <h1>SKY<span>SPORT</span></h1>
        <span class="sub">Tạo tài khoản mới</span>
    </div>

    <div class="title">Đăng ký thành viên</div>
    <div class="subtitle">Nhập thông tin để tạo tài khoản mua sắm</div>

    <!-- Flash Messages -->
    <div th:if="${error}" class="alert-sky alert-sky-danger">
        <span><i class="fas fa-exclamation-circle"></i></span>
        <span th:text="${error}">Lỗi đăng ký</span>
    </div>

    <!-- Register Form -->
    <form th:action="@{/dang-ky}" th:object="${registerRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="fullName">Họ và tên <span style="color:#e63030;">*</span></label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-user"></i></span>
                <input type="text" id="fullName" th:field="*{fullName}"
                       placeholder="Nhập họ và tên" required>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label for="username">Tên đăng nhập <span style="color:#e63030;">*</span></label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-id-card"></i></span>
                <input type="text" id="username" th:field="*{username}"
                       placeholder="4-50 ký tự" required>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại <span style="color:#e63030;">*</span></label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-phone"></i></span>
                <input type="text" id="phone" th:field="*{phone}"
                       placeholder="VD: 0912345678" required>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-envelope"></i></span>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="Nhập email (không bắt buộc)">
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu <span style="color:#e63030;">*</span></label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Tối thiểu 6 ký tự" required>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu <span style="color:#e63030;">*</span></label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-check-circle"></i></span>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                       placeholder="Nhập lại mật khẩu" required>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <button type="submit" class="btn-register">
            <i class="fas fa-user-plus"></i> Đăng ký
        </button>
    </form>

    <hr class="divider">

    <div class="back-link">
        Đã có tài khoản? <a href="/login"><strong>Đăng nhập ngay</strong></a>
    </div>
    <div class="back-link" style="margin-top:6px;font-size:12px;color:#4a4a4a;">
        <a href="/"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
    </div>
</div>
</body>
</html>
