<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/customer/layout :: head('Thông báo')}"></head>
<body>
<div th:replace="~{layouts/customer/layout :: body}">
    <div th:fragment="content">
        <div class="cus-card">
            <div class="cus-card-header">
                <h5><i class="fas fa-bell me-2"></i>Thông báo</h5>
                <div>
                    <form th:action="@{/customer/notifications/read-all}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="cus-btn cus-btn-secondary cus-btn-sm">
                            Đánh dấu tất cả đã đọc
                        </button>
                    </form>
                </div>
            </div>
            <div class="cus-card-body">
                <div th:if="${#lists.isEmpty(notifications)}" style="text-align:center;padding:2rem 0;">
                    <i class="fas fa-bell-slash" style="font-size:3rem;color:var(--gray);display:block;margin-bottom:1rem;"></i>
                    <p style="color:var(--gray);">Không có thông báo nào.</p>
                </div>
                <div th:if="${!#lists.isEmpty(notifications)}">
                    <div th:each="n : ${notifications}" style="padding:1rem;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);" th:text="${n.title}">Tiêu đề</div>
                            <div style="font-size:.9rem;color:var(--text-secondary);" th:text="${n.content}">Nội dung</div>
                            <div style="font-size:.75rem;color:var(--text-muted);" th:text="${#temporals.format(n.createDate, 'dd/MM/yyyy HH:mm')}">01/01/2024</div>
                        </div>
                        <div>
                            <span th:if="${!n.isRead}" class="cus-badge cus-badge-warning">Chưa đọc</span>
                            <span th:if="${n.isRead}" class="cus-badge cus-badge-secondary">Đã đọc</span>
                            <form th:if="${!n.isRead}" th:action="@{/customer/notifications/read/{id}(id=${n.id})}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="cus-btn cus-btn-primary cus-btn-sm">Đã đọc</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
