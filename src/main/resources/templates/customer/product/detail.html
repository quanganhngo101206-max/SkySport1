<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div th:fragment="content">

    <!-- ===== BREADCRUMB ===== -->
    <section class="ss-crumbs">
        <div class="container">
            <nav>
                <a href="/">Trang chủ</a>
                <span>/</span>
                <a href="/san-pham">Sản phẩm</a>
                <span>/</span>
                <span class="current" th:text="${product.name}">Chi tiết</span>
            </nav>
        </div>
    </section>

    <!-- ===== PRODUCT DETAIL ===== -->
    <section style="padding:3rem 0;">
        <div class="container">
            <div class="row g-4">

                <!-- ===== LEFT: IMAGE ===== -->
                <div class="col-md-5">
                    <div class="ss-card" style="padding:2rem;text-align:center;min-height:350px;display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-tshirt" style="font-size:8rem;color:#333;"></i>
                    </div>
                </div>

                <!-- ===== RIGHT: INFO ===== -->
                <div class="col-md-7">

                    <p style="color:var(--muted);font-size:.85rem;margin-bottom:.3rem;">
                        <span th:text="${product.brand != null ? product.brand.name : ''}">Nike</span>
                        <span th:if="${product.category != null}" style="color:var(--line);"> · </span>
                        <span th:text="${product.category != null ? product.category.name : ''}">Thể thao</span>
                    </p>

                    <h1 style="font-size:2rem;color:var(--paper);margin-bottom:.6rem;display:flex;align-items:center;gap:14px;">
                        <span th:text="${product.name}">Tên sản phẩm</span>

                        <form sec:authorize="hasRole('CUSTOMER')"
                              th:action="@{/customer/wishlist/{action}(action = ${inWishlist} ? 'remove' : 'add')}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="productId" th:value="${product.id}"/>
                            <input type="hidden" name="redirectTo" th:value="${currentUrl}"/>
                            <button type="submit"
                                    th:title="${inWishlist} ? 'Xóa khỏi yêu thích' : 'Thêm vào yêu thích'"
                                    style="width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;"
                                    th:style="${inWishlist} ? 'width:42px;height:42px;border-radius:50%;border:1px solid var(--flare);background:var(--flare);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;' : 'width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;'">
                                <i class="fas fa-heart"></i>
                            </button>
                        </form>
                        <a sec:authorize="!hasRole('CUSTOMER')" href="/login" title="Đăng nhập để thêm vào yêu thích"
                           style="width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;text-decoration:none;">
                            <i class="far fa-heart"></i>
                        </a>
                    </h1>

                    <div th:with="firstDetail=${productDetails != null and !#lists.isEmpty(productDetails) ? productDetails[0] : null}">
                        <div class="display" style="font-size:1.9rem;color:var(--flare);margin-bottom:1.5rem;"
                             th:text="${firstDetail != null ? #numbers.formatDecimal(firstDetail.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">
                            250.000đ
                        </div>
                    </div>

                    <!-- ===== ADD TO CART / BUY NOW FORM ===== -->
                    <form id="variantForm">
                        <input type="hidden" id="productDetailId" name="productDetailId" value=""/>

                        <!-- Màu sắc -->
                        <div class="mb-3" th:if="${#lists.size(distinctColors) > 0}">
                            <label style="color:var(--paper);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px;">Màu sắc</label>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <span th:each="color : ${distinctColors}">
                                    <span class="color-swatch"
                                          th:style="'display:inline-block;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:.2s;background-color:' + ${color.hexCode}"
                                          th:title="${color.name}"
                                          th:data-color-id="${color.id}"></span>
                                </span>
                            </div>
                            <span style="color:var(--muted);font-size:.8rem;display:block;margin-top:6px;" id="selectedColorText">Chọn màu</span>
                        </div>

                        <!-- Size -->
                        <div class="mb-3" th:if="${#lists.size(distinctSizes) > 0}">
                            <label style="color:var(--paper);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px;">Kích cỡ</label>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <span th:each="size : ${distinctSizes}">
                                    <button type="button" class="size-btn btn-ss btn-ss-ghost btn-ss-sm"
                                            th:text="${size.name}"
                                            th:data-size-id="${size.id}">M</button>
                                </span>
                            </div>
                            <span style="color:var(--muted);font-size:.8rem;display:block;margin-top:6px;" id="selectedSizeText">Chọn size</span>
                        </div>

                        <!-- Số lượng -->
                        <div class="mb-3">
                            <label style="color:var(--paper);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px;">Số lượng</label>
                            <div style="display:flex;gap:8px;align-items:center;">
                                <button type="button" class="btn-ss btn-ss-ghost btn-ss-sm" style="padding:.5rem .9rem;font-size:1.1rem;" onclick="changeQty(-1)">−</button>
                                <input type="number" name="quantity" id="qty" value="1" min="1"
                                       style="width:60px;text-align:center;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:.5rem 0;font-size:1rem;"/>
                                <button type="button" class="btn-ss btn-ss-ghost btn-ss-sm" style="padding:.5rem .9rem;font-size:1.1rem;" onclick="changeQty(1)">+</button>
                            </div>
                        </div>

                        <div style="display:flex;gap:10px;">
                            <button type="button" id="btnAddToCart" class="btn-ss btn-ss-ghost btn-ss-block" style="padding:1rem;font-size:1rem;flex:1;">
                                <i class="fas fa-cart-plus"></i>
                                <span id="btnText">Thêm vào giỏ hàng</span>
                            </button>
                            <button type="button" id="btnBuyNow" class="btn-ss btn-ss-primary btn-ss-block" style="padding:1rem;font-size:1rem;flex:1;">
                                <i class="fas fa-bolt"></i> Mua ngay
                            </button>
                        </div>
                    </form>
                    <div id="pdpToast" style="display:none;margin-top:10px;padding:.7rem 1rem;border-radius:8px;font-size:.9rem;"></div>

                    <!-- Mô tả -->
                    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--line);">
                        <h5 style="text-transform:none;font-family:'Inter';color:var(--paper);font-weight:700;font-size:1rem;margin-bottom:.5rem;">Mô tả sản phẩm</h5>
                        <p style="color:var(--muted);line-height:1.7;" th:utext="${product.description}">Mô tả sản phẩm...</p>
                        <p style="color:var(--muted);font-size:.85rem;margin-top:.5rem;">
                            <strong style="color:var(--paper);">Chất liệu:</strong>
                            <span th:text="${product.material != null ? product.material.name : 'N/A'}">Cotton</span>
                        </p>
                        <p style="color:var(--muted);font-size:.85rem;">
                            <strong style="color:var(--paper);">Giới tính:</strong>
                            <span th:if="${product.gender == 1}">Nam</span>
                            <span th:if="${product.gender == 2}">Nữ</span>
                            <span th:if="${product.gender == 3 or product.gender == null}">Unisex</span>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </section>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var CSRF_PARAM_NAME = /*[[${_csrf.parameterName}]]*/ '_csrf';
    /*]]>*/

    // Bảng tra "màu + size -> ProductDetail.id" — build 1 lần khi load trang
    // từ toàn bộ productDetails (danh sách gốc, KHÔNG phải distinctColors/
    // distinctSizes). Đây là chỗ fix bug chính: trước đây selectColor và
    // selectSize đều ghi đè trực tiếp #productDetailId nên chọn cái sau sẽ
    // xóa mất lựa chọn của cái trước.
    var variantList = [];
    /*[# th:each="d : ${productDetails}"]*/
    /*[# th:if="${d.color != null and d.size != null}"]*/
    variantList.push({
        colorId: /*[[${d.color.id}]]*/ '',
        sizeId: /*[[${d.size.id}]]*/ '',
        detailId: /*[[${d.id}]]*/ 0,
        quantity: /*[[${d.quantity}]]*/ 0
    });
    /*[/]*/
    /*[/]*/

    var variantMap = {};
    variantList.forEach(function (v) {
        variantMap[v.colorId + '|' + v.sizeId] = { id: v.detailId, quantity: v.quantity };
    });

    var selectedColorId = null;
    var selectedSizeId = null;

    function selectColor(el, colorId) {
        document.querySelectorAll('.color-swatch').forEach(s => { s.style.borderColor = 'var(--line)'; s.style.boxShadow = 'none'; });
        el.style.borderColor = 'var(--flare)';
        el.style.boxShadow = '0 0 0 2px var(--flare)';
        selectedColorId = colorId;
        document.getElementById('selectedColorText').textContent = 'Đã chọn: ' + el.getAttribute('title');
        resolveVariant();
    }

    function selectSize(el, sizeId) {
        document.querySelectorAll('.size-btn').forEach(b => {
            b.style.borderColor = 'var(--line)'; b.style.background = 'var(--panel-2)'; b.style.color = 'var(--muted)';
        });
        el.style.borderColor = 'var(--flare)';
        el.style.background = 'var(--flare)';
        el.style.color = '#fff';
        selectedSizeId = sizeId;
        document.getElementById('selectedSizeText').textContent = 'Đã chọn: ' + el.textContent;
        resolveVariant();
    }

    // Chỉ khi đã chọn ĐỦ cả màu lẫn size mới tra variantMap ra đúng
    // ProductDetail.id thật của tổ hợp đó.
    function resolveVariant() {
        document.getElementById('productDetailId').value = '';
        if (!selectedColorId || !selectedSizeId) return;

        var v = variantMap[selectedColorId + '|' + selectedSizeId];
        if (v && v.quantity > 0) {
            document.getElementById('productDetailId').value = v.id;
        } else {
            showPdpToast('Tổ hợp màu/size này hiện không có sẵn hoặc đã hết hàng', 'error');
        }
    }

    // Gắn event bằng JS thuần (KHÔNG dùng th:onclick) — Thymeleaf 3.1 chặn
    // biến kiểu String nội suy trực tiếp vào thuộc tính sự kiện DOM
    // (onclick/onload...) để chống injection, chỉ đọc được qua data-*.
    document.querySelectorAll('.color-swatch').forEach(function (el) {
        el.addEventListener('click', function () {
            selectColor(this, this.getAttribute('data-color-id'));
        });
    });
    document.querySelectorAll('.size-btn').forEach(function (el) {
        el.addEventListener('click', function () {
            if (this.disabled) return;
            selectSize(this, this.getAttribute('data-size-id'));
        });
    });

    function changeQty(delta) {
        var input = document.getElementById('qty');
        var val = parseInt(input.value) + delta;
        if (val >= 1) input.value = val;
    }

    function getSelectedDetailId() {
        return document.getElementById('productDetailId').value;
    }

    function showPdpToast(message, type) {
        var el = document.getElementById('pdpToast');
        el.textContent = message;
        el.style.background = type === 'error' ? 'rgba(220,53,69,.15)' : 'rgba(46,213,115,.15)';
        el.style.color = type === 'error' ? '#dc3545' : '#2ed573';
        el.style.display = 'block';
        setTimeout(function () { el.style.display = 'none'; }, 3000);
    }

    document.getElementById('btnAddToCart').addEventListener('click', function () {
        var detailId = getSelectedDetailId();
        if (!detailId) {
            showPdpToast('Vui lòng chọn màu sắc hoặc kích cỡ trước khi thêm vào giỏ!', 'error');
            return;
        }
        var qty = document.getElementById('qty').value || 1;
        var csrfToken = document.querySelector('meta[name="_csrf"]').content;
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        var body = new URLSearchParams();
        body.set('productDetailId', detailId);
        body.set('quantity', qty);

        var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        headers[csrfHeader] = csrfToken;

        fetch('/customer/cart/add', { method: 'POST', headers: headers, body: body.toString() })
            .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
            .then(function (res) {
                if (res.ok && res.data.success) {
                    showPdpToast('Đã thêm vào giỏ hàng!', 'success');
                    if (typeof updateCartBadge === 'function') updateCartBadge(res.data.cartCount);
                } else {
                    showPdpToast(res.data.message || 'Không thể thêm vào giỏ', 'error');
                }
            })
            .catch(function () { showPdpToast('Không thể kết nối tới máy chủ', 'error'); });
    });

    document.getElementById('btnBuyNow').addEventListener('click', function () {
        var detailId = getSelectedDetailId();
        if (!detailId) {
            showPdpToast('Vui lòng chọn màu sắc hoặc kích cỡ trước khi mua!', 'error');
            return;
        }
        var qty = document.getElementById('qty').value || 1;
        var csrfToken = document.querySelector('meta[name="_csrf"]').content;

        // Submit thật (không phải AJAX) để trình duyệt theo đúng redirect
        // sang trang checkout ở chế độ mua ngay.
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/customer/cart/buy-now';

        function addField(name, value) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        }
        addField('productDetailId', detailId);
        addField('quantity', qty);
        addField(CSRF_PARAM_NAME, csrfToken);

        document.body.appendChild(form);
        form.submit();
    });
</script>

</body>
</html>
