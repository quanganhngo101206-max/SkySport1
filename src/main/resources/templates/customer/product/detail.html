<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name} + ' | SkySport')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- ============================================================ -->
<!-- CONTENT -->
<!-- ============================================================ -->
<div th:fragment="content">

    <!-- ===== BREADCRUMB ===== -->
    <section style="background:#111;padding:1.5rem 0;border-bottom:1px solid #222;">
        <div class="container">
            <nav style="display:flex;gap:8px;font-size:.85rem;color:#888;">
                <a href="/" style="color:#888;">Trang chủ</a>
                <span>/</span>
                <a href="/san-pham" style="color:#888;">Sản phẩm</a>
                <span>/</span>
                <span style="color:#e63030;font-weight:600;" th:text="${product.name}">Chi tiết</span>
            </nav>
        </div>
    </section>

    <!-- ===== PRODUCT DETAIL ===== -->
    <section style="padding:3rem 0;">
        <div class="container">

            <div class="row g-4">

                <!-- ===== LEFT: IMAGE ===== -->
                <div class="col-md-5">
                    <div style="background:#1a1a1a;border:1px solid #222;border-radius:16px;padding:2rem;text-align:center;min-height:350px;display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-tshirt" style="font-size:8rem;color:#333;"></i>
                    </div>
                </div>

                <!-- ===== RIGHT: INFO ===== -->
                <div class="col-md-7">

                    <!-- Brand + Category -->
                    <p style="color:#888;font-size:.85rem;margin-bottom:.3rem;">
                        <span th:text="${product.brand != null ? product.brand.name : ''}">Nike</span>
                        <span th:if="${product.category != null}" style="color:#333;"> · </span>
                        <span th:text="${product.category != null ? product.category.name : ''}">Thể thao</span>
                    </p>

                    <!-- Product name -->
                    <h1 style="font-size:2.2rem;font-weight:900;color:#f5f5f5;margin-bottom:.5rem;" th:text="${product.name}">
                        Tên sản phẩm
                    </h1>

                    <!-- Giá -->
                    <div th:with="firstDetail=${productDetails != null and !#lists.isEmpty(productDetails) ? productDetails[0] : null}">
                        <div style="font-size:2rem;font-weight:900;color:#e63030;margin-bottom:1.5rem;"
                             th:text="${firstDetail != null ? #numbers.formatDecimal(firstDetail.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">
                            250,000đ
                        </div>
                    </div>

                    <!-- ===== ADD TO CART FORM ===== -->
                    <form th:action="@{/customer/cart/add}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" id="productDetailId" name="productDetailId" th:value="${firstDetail != null ? firstDetail.id : ''}"/>

                        <!-- Màu sắc -->
                        <div class="mb-3" th:if="${#lists.size(productDetails) > 0}">
                            <label style="color:#f5f5f5;font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;">Màu sắc</label>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <span th:each="detail : ${productDetails}" th:if="${detail.color != null}">
                                    <span class="color-swatch"
                                          style="display:inline-block;width:32px;height:32px;border-radius:50%;border:2px solid #444;cursor:pointer;transition:.2s;"
                                          th:style="'background-color:' + ${detail.color.hexCode}"
                                          th:title="${detail.color.name}"
                                          th:data-detail-id="${detail.id}"
                                          th:onclick="'selectColor(this, ' + ${detail.id} + ')'"
                                          onmouseover="this.style.borderColor='#e63030'"
                                          onmouseout="this.style.borderColor='#444'"></span>
                                </span>
                            </div>
                            <span style="color:#888;font-size:.8rem;display:block;margin-top:4px;" id="selectedColorText">Chọn màu</span>
                        </div>

                        <!-- Size -->
                        <div class="mb-3" th:if="${#lists.size(productDetails) > 0}">
                            <label style="color:#f5f5f5;font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;">Kích cỡ</label>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <span th:each="detail : ${productDetails}" th:if="${detail.size != null}">
                                    <button type="button" class="size-btn"
                                            style="padding:6px 18px;background:transparent;border:1px solid #444;border-radius:8px;color:#888;font-weight:600;font-size:.85rem;cursor:pointer;transition:.2s;"
                                            th:text="${detail.size.name}"
                                            th:data-detail-id="${detail.id}"
                                            th:disabled="${detail.quantity <= 0}"
                                            th:classappend="${detail.quantity <= 0} ? 'opacity-50' : ''"
                                            th:onclick="'selectSize(this, ' + ${detail.id} + ')'"
                                            onmouseover="if(!this.disabled){this.style.borderColor='#e63030';this.style.color='#f5f5f5'}"
                                            onmouseout="if(!this.disabled){this.style.borderColor='#444';this.style.color='#888'}">M</button>
                                </span>
                            </div>
                            <span style="color:#888;font-size:.8rem;display:block;margin-top:4px;" id="selectedSizeText">Chọn size</span>
                        </div>

                        <!-- Số lượng -->
                        <div class="mb-3">
                            <label style="color:#f5f5f5;font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;">Số lượng</label>
                            <div style="display:flex;gap:8px;align-items:center;">
                                <button type="button" style="padding:6px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#888;cursor:pointer;font-size:1.2rem;" onclick="changeQty(-1)">−</button>
                                <input type="number" name="quantity" id="qty" value="1" min="1"
                                       style="width:60px;text-align:center;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:#f5f5f5;padding:6px 0;font-size:1rem;"/>
                                <button type="button" style="padding:6px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#888;cursor:pointer;font-size:1.2rem;" onclick="changeQty(1)">+</button>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-red"
                                style="width:100%;padding:.9rem;border:none;border-radius:10px;background:#e63030;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:.3s;"
                                onmouseover="this.style.background='#c82020'"
                                onmouseout="this.style.background='#e63030'">
                            <i class="fas fa-cart-plus me-2"></i>
                            <span id="btnText">Thêm vào giỏ hàng</span>
                        </button>
                    </form>

                    <!-- Mô tả -->
                    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #222;">
                        <h5 style="color:#f5f5f5;font-weight:700;font-size:1rem;margin-bottom:.5rem;">Mô tả sản phẩm</h5>
                        <p style="color:#888;line-height:1.7;" th:utext="${product.description}">Mô tả sản phẩm...</p>
                        <p style="color:#888;font-size:.85rem;margin-top:.5rem;">
                            <strong>Chất liệu:</strong>
                            <span th:text="${product.material != null ? product.material.name : 'N/A'}">Cotton</span>
                        </p>
                        <p style="color:#888;font-size:.85rem;">
                            <strong>Giới tính:</strong>
                            <span th:if="${product.gender == 1}">Nam</span>
                            <span th:if="${product.gender == 2}">Nữ</span>
                            <span th:if="${product.gender == 3 or product.gender == null}">Unisex</span>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </section>

</div>
<!-- ===== END CONTENT ===== -->

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
    var selectedDetailId = null;

    function selectColor(el, detailId) {
        document.querySelectorAll('.color-swatch').forEach(s => { s.style.borderColor = '#444'; });
        el.style.borderColor = '#e63030';
        el.style.boxShadow = '0 0 0 2px #e63030';
        selectedDetailId = detailId;
        document.getElementById('productDetailId').value = detailId;
        document.getElementById('selectedColorText').textContent = '✅ Đã chọn: ' + el.getAttribute('title');
        updateButtonText();
    }

    function selectSize(el, detailId) {
        document.querySelectorAll('.size-btn').forEach(b => {
            b.style.borderColor = '#444'; b.style.background = 'transparent'; b.style.color = '#888';
        });
        el.style.borderColor = '#e63030';
        el.style.background = '#e63030';
        el.style.color = '#fff';
        selectedDetailId = detailId;
        document.getElementById('productDetailId').value = detailId;
        document.getElementById('selectedSizeText').textContent = '✅ Đã chọn: ' + el.textContent;
        updateButtonText();
    }

    function changeQty(delta) {
        var input = document.getElementById('qty');
        var val = parseInt(input.value) + delta;
        if (val >= 1) input.value = val;
    }

    function updateButtonText() {
        var detailId = document.getElementById('productDetailId').value;
        document.getElementById('btnText').textContent = (detailId && detailId !== '') ? 'Thêm vào giỏ hàng' : '⚠️ Vui lòng chọn màu hoặc size';
    }

    document.querySelector('form').addEventListener('submit', function(e) {
        var detailId = document.getElementById('productDetailId').value;
        if (!detailId || detailId === '') {
            e.preventDefault();
            alert('Vui lòng chọn màu sắc hoặc kích cỡ trước khi thêm vào giỏ!');
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        var firstDetail = document.querySelector('.color-swatch');
        if (firstDetail) {
            var detailId = firstDetail.getAttribute('data-detail-id');
            selectColor(firstDetail, parseInt(detailId));
        } else {
            var firstSize = document.querySelector('.size-btn:not([disabled])');
            if (firstSize) {
                var detailId = firstSize.getAttribute('data-detail-id');
                selectSize(firstSize, parseInt(detailId));
            }
        }
    });
</script>

</body>
</html>
