<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Danh sách sản phẩm')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div th:fragment="content">

    <!-- ===== BREADCRUMB ===== -->
    <section class="ss-crumbs">
        <div class="container">
            <nav>
                <a href="/">Trang chủ</a>
                <span>/</span>
                <span class="current">Sản phẩm</span>
            </nav>
        </div>
    </section>

    <!-- ===== PRODUCT LIST ===== -->
    <section style="padding:3rem 0;">
        <div class="container">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
                <h1 style="font-size:1.9rem;color:var(--paper);margin:0;">
                    <i class="fas fa-box" style="color:var(--flare);margin-right:12px;"></i>
                    Tất cả sản phẩm
                    <span style="font-size:1rem;font-family:'Inter';font-weight:400;color:var(--muted);text-transform:none;margin-left:8px;"
                          th:text="'(' + ${#lists.size(products)} + ' sản phẩm)'">(0 sản phẩm)</span>
                </h1>
            </div>

            <!-- ===== FILTERS ===== -->
            <form th:action="@{/san-pham}" method="get" class="ss-card"
                  style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:2rem;padding:1rem;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sản phẩm..."
                       style="flex:1;min-width:200px;padding:.6rem 1rem;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);font-size:.9rem;">
                <select name="categoryId" style="padding:.6rem 1rem;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);font-size:.9rem;">
                    <option value="">-- Danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
                </select>
                <select name="brandId" style="padding:.6rem 1rem;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--paper);font-size:.9rem;">
                    <option value="">-- Thương hiệu --</option>
                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == brandId}"></option>
                </select>
                <button type="submit" class="btn-ss btn-ss-primary btn-ss-sm">
                    <i class="fas fa-search"></i> Lọc
                </button>
                <a href="/san-pham" class="btn-ss btn-ss-ghost btn-ss-sm">
                    <i class="fas fa-undo"></i> Xóa lọc
                </a>
            </form>

            <!-- ===== PRODUCT GRID ===== -->
            <div th:if="${!#lists.isEmpty(products)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.5rem;">

                <div th:each="product : ${products}" th:object="${product}"
                     class="ss-card" style="position:relative;overflow:hidden;transition:.25s;"
                     onmouseover="this.style.borderColor='var(--flare)';this.style.transform='translateY(-6px)'"
                     onmouseout="this.style.borderColor='var(--line)';this.style.transform='translateY(0)'">

                    <!-- Nút tim (wishlist) -->
                    <form sec:authorize="hasRole('CUSTOMER')"
                          th:action="@{/customer/wishlist/{action}(action = ${wishlistProductIds.contains(product.id)} ? 'remove' : 'add')}"
                          method="post" style="position:absolute;top:.6rem;right:.6rem;z-index:2;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${product.id}"/>
                        <input type="hidden" name="redirectTo" th:value="${currentUrl}"/>
                        <button type="submit" title="Thêm vào yêu thích"
                                style="width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;"
                                th:style="${wishlistProductIds.contains(product.id)} ? 'width:34px;height:34px;border-radius:50%;border:1px solid var(--flare);background:var(--flare);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;' : 'width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;'">
                            <i class="fas fa-heart"></i>
                        </button>
                    </form>
                    <a sec:authorize="!hasRole('CUSTOMER')"
                       href="/login" title="Đăng nhập để thêm vào yêu thích"
                       style="position:absolute;top:.6rem;right:.6rem;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;">
                        <i class="far fa-heart"></i>
                    </a>

                    <a th:href="@{/san-pham/{slug}(slug=${product.slug})}" style="display:block;">
                        <div style="background:var(--panel-2);height:200px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);">
                            <i class="fas fa-tshirt" style="font-size:4rem;color:#333;"></i>
                        </div>
                    </a>

                    <div style="padding:1rem 1.2rem 1.2rem;">
                        <div style="font-size:.7rem;color:var(--muted);margin-bottom:.3rem;">
                            <span th:text="${product.brand != null ? product.brand.name : ''}">Nike</span>
                            <span th:if="${product.category != null}" style="color:var(--line);"> · </span>
                            <span th:text="${product.category != null ? product.category.name : ''}">Thể thao</span>
                        </div>

                        <a th:href="@{/san-pham/{slug}(slug=${product.slug})}"
                           style="display:block;font-weight:700;color:var(--paper);font-size:.95rem;margin-bottom:.4rem;"
                           th:text="${product.name}">Tên sản phẩm</a>

                        <div th:with="firstDetail=${product.productDetails != null and !#lists.isEmpty(product.productDetails) ? product.productDetails[0] : null}">
                            <div class="display" style="font-size:1.15rem;color:var(--flare);margin-bottom:.8rem;"
                                 th:text="${firstDetail != null ? #numbers.formatDecimal(firstDetail.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">
                                250.000đ
                            </div>

                            <div style="display:flex;gap:8px;">
                                <a th:href="@{/san-pham/{slug}(slug=${product.slug})}"
                                   class="btn-ss btn-ss-primary btn-ss-sm btn-ss-block" style="flex:1;"
                                   th:style="${firstDetail == null or firstDetail.quantity <= 0} ? 'flex:1;opacity:.5;pointer-events:none;' : 'flex:1;'">
                                    <i class="fas fa-cart-plus"></i>
                                    <span th:if="${firstDetail == null or firstDetail.quantity <= 0}">Hết hàng</span>
                                    <span th:unless="${firstDetail == null or firstDetail.quantity <= 0}">Chọn mua</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EMPTY -->
            <div th:if="${#lists.isEmpty(products)}" class="ss-card" style="text-align:center;padding:4rem 2rem;">
                <i class="fas fa-box-open" style="font-size:3rem;color:#333;display:block;margin-bottom:1rem;"></i>
                <p style="color:var(--muted);">Không tìm thấy sản phẩm nào.</p>
                <a href="/san-pham" class="btn-ss btn-ss-primary" style="margin-top:1rem;">Xem tất cả</a>
            </div>

        </div>
    </section>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
