<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Danh sách sản phẩm - SkySport')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- ============================================================ -->
<!-- CONTENT - THÊM fragment="content"                            -->
<!-- ============================================================ -->
<div th:fragment="content">

    <!-- ===== BREADCRUMB ===== -->
    <section style="background:#111;padding:1.5rem 0;border-bottom:1px solid #222;">
        <div class="container">
            <nav style="display:flex;gap:8px;font-size:.85rem;color:#888;">
                <a href="/" style="color:#888;">Trang chủ</a>
                <span>/</span>
                <span style="color:#e63030;font-weight:600;">Sản phẩm</span>
            </nav>
        </div>
    </section>

    <!-- ===== PRODUCT LIST ===== -->
    <section style="padding:3rem 0;">
        <div class="container">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
                <h1 style="font-size:2rem;font-weight:900;color:#f5f5f5;">
                    <i class="fas fa-box" style="color:#e63030;margin-right:12px;"></i>
                    Tất cả sản phẩm
                    <span style="font-size:1rem;font-weight:400;color:#888;margin-left:8px;" th:text="'(' + ${#lists.size(products)} + ' sản phẩm)'">(0 sản phẩm)</span>
                </h1>
            </div>

            <!-- ===== FILTERS ===== -->
            <form th:action="@{/san-pham}" method="get" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:2rem;background:#111;padding:1rem;border-radius:12px;border:1px solid #222;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sản phẩm..."
                       style="flex:1;min-width:200px;padding:8px 14px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#f5f5f5;font-size:.9rem;">
                <select name="categoryId" style="padding:8px 14px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#f5f5f5;font-size:.9rem;">
                    <option value="">-- Danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
                </select>
                <select name="brandId" style="padding:8px 14px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#f5f5f5;font-size:.9rem;">
                    <option value="">-- Thương hiệu --</option>
                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == brandId}"></option>
                </select>
                <button type="submit" class="btn btn-red" style="padding:8px 24px;border:none;border-radius:8px;background:#e63030;color:#fff;font-weight:600;cursor:pointer;">
                    <i class="fas fa-search"></i> Lọc
                </button>
                <a href="/san-pham" style="padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#888;font-size:.9rem;text-decoration:none;display:flex;align-items:center;">
                    <i class="fas fa-undo me-1"></i> Xóa lọc
                </a>
            </form>

            <!-- ===== PRODUCT GRID ===== -->
            <div th:if="${!#lists.isEmpty(products)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.5rem;">

                <div th:each="product : ${products}" th:object="${product}"
                     style="background:#111;border:1px solid #222;border-radius:16px;overflow:hidden;transition:.3s;"
                     onmouseover="this.style.borderColor='#e63030';this.style.transform='translateY(-6px)'"
                     onmouseout="this.style.borderColor='#222';this.style.transform='translateY(0)'">

                    <a th:href="@{/san-pham/{slug}(slug=${product.slug})}" style="display:block;">
                        <div style="background:#1a1a1a;height:200px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #222;">
                            <i class="fas fa-tshirt" style="font-size:4rem;color:#333;"></i>
                        </div>
                    </a>

                    <div style="padding:1rem 1.2rem 1.2rem;">
                        <div style="font-size:.7rem;color:#888;margin-bottom:.3rem;">
                            <span th:text="${product.brand != null ? product.brand.name : ''}">Nike</span>
                            <span th:if="${product.category != null}" style="color:#333;"> · </span>
                            <span th:text="${product.category != null ? product.category.name : ''}">Thể thao</span>
                        </div>

                        <a th:href="@{/san-pham/{slug}(slug=${product.slug})}"
                           style="display:block;font-weight:700;color:#f5f5f5;font-size:.95rem;margin-bottom:.4rem;"
                           th:text="${product.name}">Tên sản phẩm</a>

                        <div th:with="firstDetail=${product.productDetails != null and !#lists.isEmpty(product.productDetails) ? product.productDetails[0] : null}">
                            <div style="font-size:1.1rem;font-weight:800;color:#e63030;margin-bottom:.8rem;"
                                 th:text="${firstDetail != null ? #numbers.formatDecimal(firstDetail.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">
                                250,000đ
                            </div>

                            <div style="display:flex;gap:8px;">
                                <a th:href="@{/san-pham/{slug}(slug=${product.slug})}"
                                   style="flex:1;text-align:center;padding:.5rem .8rem;background:transparent;border:1px solid #333;border-radius:8px;color:#888;font-size:.8rem;font-weight:600;text-decoration:none;">
                                    <i class="fas fa-eye me-1"></i> Xem
                                </a>
                                <form th:action="@{/customer/cart/add}" method="post" style="flex:1;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="productDetailId" th:value="${firstDetail != null ? firstDetail.id : ''}"/>
                                    <input type="hidden" name="quantity" value="1"/>
                                    <button type="submit"
                                            style="width:100%;padding:.5rem .8rem;background:#e63030;border:none;border-radius:8px;color:#fff;font-size:.8rem;font-weight:600;cursor:pointer;"
                                            th:disabled="${firstDetail == null or firstDetail.quantity <= 0}"
                                            th:classappend="${firstDetail == null or firstDetail.quantity <= 0} ? 'opacity-50' : ''">
                                        <i class="fas fa-cart-plus me-1"></i>
                                        <span th:if="${firstDetail == null or firstDetail.quantity <= 0}">Hết hàng</span>
                                        <span th:unless="${firstDetail == null or firstDetail.quantity <= 0}">Thêm</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EMPTY -->
            <div th:if="${#lists.isEmpty(products)}" style="text-align:center;padding:4rem 2rem;background:#111;border:1px solid #222;border-radius:16px;">
                <i class="fas fa-box-open" style="font-size:3rem;color:#333;display:block;margin-bottom:1rem;"></i>
                <p style="color:#888;">Không tìm thấy sản phẩm nào.</p>
                <a href="/san-pham" class="btn btn-red" style="padding:.8rem 2rem;display:inline-block;margin-top:1rem;">Xem tất cả</a>
            </div>

        </div>
    </section>

</div>
<!-- ===== END CONTENT ===== -->

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
