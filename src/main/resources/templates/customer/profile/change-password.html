<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/customer/layout :: head('Đổi mật khẩu')}"></head>
<body>
<div th:replace="~{layouts/customer/layout :: body}">
    <div th:fragment="content">
        <div class="cus-card">
            <div class="cus-card-header">
                <h5><i class="fas fa-key me-2"></i>Đổi mật khẩu</h5>
            </div>
            <div class="cus-card-body">
                <form th:action="@{/customer/profile/change-password}" th:object="${changePasswordRequest}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="cus-form-group">
                                <label class="cus-label required">Mật khẩu hiện tại</label>
                                <input type="password" class="cus-input" th:field="*{currentPassword}" required>
                                <span class="text-danger" th:errors="*{currentPassword}"></span>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="cus-form-group">
                                <label class="cus-label required">Mật khẩu mới</label>
                                <input type="password" class="cus-input" th:field="*{newPassword}" required>
                                <span class="text-danger" th:errors="*{newPassword}"></span>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="cus-form-group">
                                <label class="cus-label required">Xác nhận mật khẩu mới</label>
                                <input type="password" class="cus-input" th:field="*{confirmPassword}" required>
                                <span class="text-danger" th:errors="*{confirmPassword}"></span>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="cus-btn cus-btn-primary">
                                <i class="fas fa-save"></i> Đổi mật khẩu
                            </button>
                            <a href="/customer/profile" class="cus-btn cus-btn-secondary">Hủy</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
