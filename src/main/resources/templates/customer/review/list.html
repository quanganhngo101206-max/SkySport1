<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/customer/layout :: head('Đánh giá của tôi')}"></head>
<body>
<div th:replace="~{layouts/customer/layout :: body}">
  <div th:fragment="content">
    <div class="cus-card">
      <div class="cus-card-header">
        <h5><i class="fas fa-star me-2"></i>Đánh giá của tôi</h5>
      </div>
      <div class="cus-card-body">
        <div th:if="${#lists.isEmpty(reviews)}" style="text-align:center;padding:2rem 0;">
          <i class="fas fa-star" style="font-size:3rem;color:var(--gray);display:block;margin-bottom:1rem;"></i>
          <p style="color:var(--gray);">Bạn chưa có đánh giá nào.</p>
        </div>
        <div th:if="${!#lists.isEmpty(reviews)}">
          <table class="cus-table">
            <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đánh giá</th>
              <th>Nội dung</th>
              <th>Ngày tạo</th>
              <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
              <td th:text="${review.billDetail.productNameSnapshot}">Sản phẩm</td>
              <td>
                <span th:each="i : ${#numbers.sequence(1, review.rating)}">⭐</span>
              </td>
              <td th:text="${review.comment}">Nội dung</td>
              <td th:text="${#temporals.format(review.createDate, 'dd/MM/yyyy')}">01/01/2024</td>
              <td>
                <a th:href="@{/customer/reviews/edit/{id}(id=${review.id})}" class="cus-btn cus-btn-secondary cus-btn-sm">
                  <i class="fas fa-edit"></i>
                </a>
                <form th:action="@{/customer/reviews/delete/{id}(id=${review.id})}" method="post" style="display:inline;">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="cus-btn cus-btn-danger cus-btn-sm" onclick="return confirm('Xóa đánh giá này?')">
                    <i class="fas fa-trash"></i>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
