<div th:fragment="content">
  <div class="ss-card" style="padding:1.5rem;">
    <h3 style="font-size:1.05rem;font-weight:800;color:var(--paper);margin-bottom:1.2rem;">
      <i class="fas fa-heart" style="color:var(--flare);margin-right:10px;"></i>
      Sản phẩm yêu thích
    </h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- EMPTY -->
    <div th:if="${#lists.isEmpty(items)}" style="text-align:center;padding:3rem 1rem;">
      <i class="fas fa-heart-broken" style="font-size:3rem;color:#333;display:block;margin-bottom:1rem;"></i>
      <p style="color:var(--muted);">Chưa có sản phẩm nào trong danh sách yêu thích.</p>
      <a th:href="@{/san-pham}" class="btn-ss btn-ss-primary" style="margin-top:.5rem;">
        <i class="fas fa-shopping-bag"></i> Khám phá sản phẩm
      </a>
    </div>

    <!-- LIST -->
    <div th:if="${!#lists.isEmpty(items)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.2rem;">

      <div th:each="item : ${items}" th:with="product=${item.product},
                              firstDetail=${item.product != null and item.product.productDetails != null and !#lists.isEmpty(item.product.productDetails) ? item.product.productDetails[0] : null}"
           class="ss-card" style="overflow:hidden;">

        <a th:if="${product != null and product.slug != null}" th:href="@{/san-pham/{slug}(slug=${product.slug})}" style="display:block;">
          <div style="background:var(--panel-2);height:150px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);">
            <i class="fas fa-tshirt" style="font-size:3rem;color:#333;"></i>
          </div>
        </a>

        <div style="padding:1rem;">
          <a th:if="${product != null and product.slug != null}" th:href="@{/san-pham/{slug}(slug=${product.slug})}"
             style="display:block;font-weight:700;color:var(--paper);font-size:.9rem;margin-bottom:.4rem;"
             th:text="${product != null ? product.name : 'Sản phẩm không còn tồn tại'}">Tên sản phẩm</a>
          <span th:unless="${product != null and product.slug != null}"
                style="display:block;font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:.4rem;">
                        Sản phẩm không còn tồn tại
                    </span>

          <div th:if="${firstDetail != null}" class="display" style="font-size:1rem;color:var(--flare);margin-bottom:.6rem;"
               th:text="${#numbers.formatDecimal(firstDetail.price, 0, 'COMMA', 0, 'POINT') + 'đ'}">
            250.000đ
          </div>

          <div style="display:flex;gap:8px;">
            <a th:if="${product != null and product.slug != null}" th:href="@{/san-pham/{slug}(slug=${product.slug})}"
               class="btn-ss btn-ss-ghost btn-ss-sm" style="flex:1;">
              <i class="fas fa-eye"></i> Xem
            </a>
            <form th:action="@{/customer/wishlist/remove}" method="post" style="flex:1;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="productId" th:value="${product != null ? product.id : ''}"/>
              <button type="submit" class="btn-ss btn-ss-ghost btn-ss-sm btn-ss-block"
                      style="color:var(--flare);" onclick="return confirm('Xóa sản phẩm này khỏi yêu thích?')">
                <i class="fas fa-trash"></i> Xóa
              </button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
