<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - SkySport</title>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
        }
        .error-container h1 {
            font-size: 4rem;
            color: #e63030;
            margin-bottom: 0;
        }
        .error-container p {
            color: #888;
            font-size: 1.2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #e63030;
            color: #fff;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #c82020;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>⚠️</h1>
    <h2>Đã xảy ra lỗi</h2>
    <p th:text="${error}">Vui lòng thử lại sau.</p>
    <a href="/" class="btn">Về trang chủ</a>
</div>
</body>
</html>
