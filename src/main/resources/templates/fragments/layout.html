<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SkySport'">SkySport</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --black: #0a0a0a;
            --white: #f5f5f5;
            --red: #e63030;
            --gray: #888;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            padding: .6rem 1.4rem;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: .9rem;
            transition: .2s;
        }
        .btn-red {
            background: var(--red);
            color: #fff;
        }
        .btn-red:hover {
            background: #c82020;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--white);
            color: var(--white);
        }
        .btn-outline:hover {
            background: var(--white);
            color: var(--black);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
    </style>
</head>

<!-- Navbar -->
<nav th:fragment="navbar">
    <header style="background:#111;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:100">
        <div class="container" style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem">
            <a href="/" style="font-size:1.6rem;font-weight:900;letter-spacing:2px;color:var(--red)">
                SKY<span style="color:var(--white)">SPORT</span>
            </a>
            <nav style="display:flex;gap:2rem;font-weight:600;text-transform:uppercase;font-size:.85rem">
                <a href="/">Trang chủ</a>
                <a href="/san-pham">Sản phẩm</a>
            </nav>
            <div style="display:flex;gap:1rem;align-items:center">
                <a href="/login" class="btn btn-outline" style="font-size:.8rem">Đăng nhập</a>
                <a href="/dang-ky" class="btn btn-red" style="font-size:.8rem">Đăng ký</a>
            </div>
        </div>
    </header>
</nav>

<!-- Footer -->
<footer th:fragment="footer">
    <footer style="background:#111;border-top:1px solid #222;padding:2rem 0;text-align:center;color:var(--gray);font-size:.85rem">
        <p>© 2026 SkySport — Áo thể thao chính hãng</p>
    </footer>
</footer>
</html>
