<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="~{fragments/layout :: head('Tra cứu đơn hàng')}">Tra cứu đơn hàng - SkySport</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. Biến màu cần thiết (dòng 18-31, chỉ cần các biến navbar/footer dùng tới) */
        :root {
            --panel: #16181c;
            --panel-2: #1d2024;
            --line: #262a2f;
            --paper: #f4f2ec;
            --muted: #8a8f98;
            --flare: #ff4433;
            --flare-dim: #c8331f;
            --radius: 14px;
        }
        a { color: inherit; text-decoration: none; }
        /* 2. Container (dòng 41) */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

        /* 3. Nút dùng trong navbar — btn-ss-ghost, btn-ss-primary, btn-ss-sm (dòng 58-72) */
        .btn-ss {
            display: inline-flex; align-items: center; gap: .5rem; justify-content: center;
            padding: .75rem 1.8rem; border-radius: 10px; border: none; cursor: pointer;
            font-weight: 700; font-size: .9rem; transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
        }
        .btn-ss:active { transform: scale(.97); }
        .btn-ss-primary { background: var(--flare); color: #fff; }
        .btn-ss-primary:hover { background: var(--flare-dim); color: #fff; }
        .btn-ss-ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
        .btn-ss-ghost:hover { border-color: var(--flare); color: var(--paper); }
        .btn-ss-sm { padding: .5rem 1.1rem; font-size: .8rem; }

        /* 4. Navbar (dòng 86-128) */
        .ss-nav {
            position: sticky; top: 0; z-index: 200;
            background: rgba(11,12,14,.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .ss-nav-inner {
            display: flex; align-items: center; justify-content: space-between;
            padding: .9rem 0; gap: 1.5rem;
        }
        .ss-brand {
            font-family: 'Anton', sans-serif; font-size: 1.5rem; letter-spacing: 1px;
            color: var(--paper); display: flex; align-items: center;
        }
        .ss-brand span { color: var(--flare); }
        .ss-links { display: flex; gap: 2rem; font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .5px; }
        .ss-links a { color: var(--muted); transition: color .15s; }
        .ss-links a:hover { color: var(--paper); }
        .ss-actions { display: flex; gap: .7rem; align-items: center; }
        .ss-icon-btn {
            position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--paper);
            transition: border-color .15s;
        }
        .ss-icon-btn:hover { border-color: var(--flare); }
        .ss-user-chip {
            display: flex; align-items: center; gap: .6rem;
            padding: .4rem .5rem .4rem .9rem; border-radius: 10px;
            background: var(--panel-2); border: 1px solid var(--line);
        }
        .ss-user-chip .avatar {
            width: 28px; height: 28px; border-radius: 50%; background: var(--flare);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: .8rem; color: #fff;
        }
        .ss-user-chip form button {
            background: none; border: none; color: var(--muted); cursor: pointer; padding: .3rem;
        }
        .ss-user-chip form button:hover { color: var(--flare); }

        @media (max-width: 860px) {
            .ss-links { display: none; }
        }

        /* 5. Footer (dòng 142-151) */
        .ss-footer {
            background: var(--panel); border-top: 1px solid var(--line);
            padding: 2.5rem 0 1.5rem; margin-top: 3rem;
        }
        .ss-footer .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 2rem; margin-bottom: 2rem; }
        .ss-footer h5 { font-family: 'Inter'; text-transform: none; font-size: .85rem; font-weight: 700; color: var(--paper); margin-bottom: .8rem; }
        .ss-footer a { color: var(--muted); font-size: .85rem; display: block; margin-bottom: .5rem; }
        .ss-footer a:hover { color: var(--flare); }
        .ss-footer .bottom { border-top: 1px solid var(--line); padding-top: 1.2rem; text-align: center; color: var(--muted); font-size: .8rem; }
        :root {
            --primary: #e63030;
            --bg-body: #0a0a0a;
            --bg-card: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .track-container {
            max-width: 560px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .track-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .track-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .track-card .logo h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -1px;
        }
        .track-card .logo h1 span { color: #ffffff; }
        .track-card .logo .sub {
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-top: 4px;
        }
        .track-card .title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .track-card .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 18px;
        }
        .nav-tabs-sky {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 18px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .nav-tabs-sky .tab-btn {
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 13px;
        }
        .nav-tabs-sky .tab-btn.active {
            border-color: rgba(230,48,48,0.35);
            background: rgba(230,48,48,0.10);
            color: #fff;
        }
        .form-block { display: none; }
        .form-block.active { display: block; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .form-group .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 46px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230, 48, 48, 0.15);
        }
        .form-group .input-wrapper input::placeholder { color: var(--text-muted); }

        .btn-track {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
        }
        .btn-track:hover {
            background: #c82020;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(230, 48, 48, 0.3);
        }

        .alert-sky {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-sky-danger {
            background: rgba(230, 48, 48, 0.1);
            border: 1px solid rgba(230, 48, 48, 0.2);
            color: var(--primary);
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link a:hover { color: var(--primary); }

        .error-text {
            color: var(--primary);
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }

        @media (max-width: 480px) {
            .track-card { padding: 24px 16px; }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="track-container">
    <div class="track-card">
        <div class="logo">
            <h1>SKY<span>SPORT</span></h1>
            <span class="sub">Tra cứu đơn hàng</span>
        </div>

        <div class="title">Tìm kiếm đơn hàng</div>
        <div class="subtitle">Chọn cách tra cứu phù hợp</div>

        <!-- Flash messages -->
        <div th:if="${error}" class="alert-sky alert-sky-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Lỗi</span>
        </div>

        <div class="nav-tabs-sky">
            <button type="button" class="tab-btn active" onclick="showBlock('byOrder')">Mã đơn + Email</button>
            <button type="button" class="tab-btn" onclick="showBlock('byContact')">SĐT/Email</button>
        </div>

        <!-- Form: by orderId + email (giữ nguyên luồng cũ) -->
        <div id="block-byOrder" class="form-block active">
            <form th:action="@{/guest/track}" th:object="${trackRequest}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="orderId">Mã đơn hàng <span style="color:var(--primary);">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon"><i class="fas fa-receipt"></i></span>
                        <input type="text" id="orderId" th:field="*{orderId}" placeholder="VD: HD202608180001" required>
                    </div>
                    <span class="error-text" th:errors="*{orderId}">Lỗi</span>
                </div>

                <div class="form-group">
                    <label for="email">Email <span style="color:var(--primary);">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" th:field="*{email}" placeholder="Nhập email dùng để đặt hàng" required>
                    </div>
                    <span class="error-text" th:errors="*{email}">Lỗi</span>
                </div>

                <button type="submit" class="btn-track">
                    <i class="fas fa-search"></i> Tra cứu đơn hàng
                </button>
            </form>
        </div>

        <!-- Form: by contact (mới) -->
        <div id="block-byContact" class="form-block">
            <form th:action="@{/guest/track-by-contact}" th:object="${trackByContactRequest}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="contact">SĐT hoặc Email <span style="color:var(--primary);">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon"><i class="fas fa-phone"></i></span>
                        <input type="text" id="contact" th:field="*{contact}" placeholder="VD: 09xxxxxxxx hoặc email@xxx.com" required>
                    </div>
                    <span class="error-text" th:errors="*{contact}">Lỗi</span>
                </div>

                <button type="submit" class="btn-track">
                    <i class="fas fa-search"></i> Tra cứu đơn hàng
                </button>
            </form>
        </div>

        <div class="back-link">
            <a href="/"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
            <span style="color:var(--border-color);margin:0 10px;">|</span>
            <a href="/login">Đăng nhập</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<script>
    function showBlock(id) {
        const byOrder = document.getElementById('block-byOrder');
        const byContact = document.getElementById('block-byContact');

        byOrder.classList.remove('active');
        byContact.classList.remove('active');

        if (id === 'byOrder') byOrder.classList.add('active');
        if (id === 'byContact') byContact.classList.add('active');

        document.querySelectorAll('.nav-tabs-sky .tab-btn').forEach(btn => btn.classList.remove('active'));
        if (id === 'byOrder') document.querySelectorAll('.nav-tabs-sky .tab-btn')[0].classList.add('active');
        if (id === 'byContact') document.querySelectorAll('.nav-tabs-sky .tab-btn')[1].classList.add('active');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
