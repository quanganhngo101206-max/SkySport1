<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SkySport'">Tra cứu đơn hàng - SkySport</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e63030;
            --bg-body: #0a0a0a;
            --bg-card: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .track-container {
            max-width: 560px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .track-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .track-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .track-card .logo h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -1px;
        }
        .track-card .logo h1 span { color: #ffffff; }
        .track-card .logo .sub {
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-top: 4px;
        }
        .track-card .title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .track-card .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .form-group .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 46px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230, 48, 48, 0.15);
        }
        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .btn-track {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
        }
        .btn-track:hover {
            background: #c82020;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(230, 48, 48, 0.3);
        }
        .alert-sky {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-sky-danger {
            background: rgba(230, 48, 48, 0.1);
            border: 1px solid rgba(230, 48, 48, 0.2);
            color: var(--primary);
        }
        .alert-sky-success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link a:hover { color: var(--primary); }
        .error-text {
            color: var(--primary);
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        @media (max-width: 480px) {
            .track-card { padding: 24px 16px; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="track-container">
    <div class="track-card">
        <div class="logo">
            <h1>SKY<span>SPORT</span></h1>
            <span class="sub">Tra cứu đơn hàng</span>
        </div>

        <div class="title">Tìm kiếm đơn hàng</div>
        <div class="subtitle">Nhập mã đơn hàng và email để theo dõi</div>

        <!-- Flash messages -->
        <div th:if="${error}" class="alert-sky alert-sky-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Lỗi</span>
        </div>

        <!-- Form -->
        <form th:action="@{/guest/track}" th:object="${trackRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="orderId">Mã đơn hàng <span style="color:var(--primary);">*</span></label>
                <div class="input-wrapper">
                    <span class="icon"><i class="fas fa-receipt"></i></span>
                    <input type="text" id="orderId" th:field="*{orderId}"
                           placeholder="VD: HD202608180001" required>
                </div>
                <span class="error-text" th:errors="*{orderId}">Lỗi</span>
            </div>

            <div class="form-group">
                <label for="email">Email <span style="color:var(--primary);">*</span></label>
                <div class="input-wrapper">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="Nhập email dùng để đặt hàng" required>
                </div>
                <span class="error-text" th:errors="*{email}">Lỗi</span>
            </div>

            <button type="submit" class="btn-track">
                <i class="fas fa-search"></i> Tra cứu đơn hàng
            </button>
        </form>

        <div class="back-link">
            <a href="/"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
            <span style="color:var(--border-color);margin:0 10px;">|</span>
            <a href="/login">Đăng nhập</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
