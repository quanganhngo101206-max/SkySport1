<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SkySport'">SkySport</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --white: #f5f5f5;
            --red: #e63030;
            --red-dark: #c82020;
            --gray: #888;
            --border: #222;
            --card-bg: #141414;
            --hover: #1a1a1a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        a { color: inherit; text-decoration: none; }

        /* Navbar */
        .cus-navbar {
            background: #111;
            border-bottom: 2px solid var(--red);
            position: sticky; top: 0; z-index: 100;
            padding: .9rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .cus-navbar .brand { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; color: var(--red); }
        .cus-navbar .brand span { color: var(--white); }
        .cus-navbar .nav-links { display: flex; gap: 1.5rem; font-weight: 600; font-size: .85rem; text-transform: uppercase; }
        .cus-navbar .nav-links a:hover { color: var(--red); }
        .cus-navbar .nav-actions { display: flex; gap: .75rem; align-items: center; }
        .cus-navbar .nav-actions a, .cus-navbar .nav-actions button {
            padding: .4rem 1rem; font-size: .8rem; font-weight: 700; border: none; cursor: pointer;
            border-radius: 6px; transition: .2s;
        }
        .btn-red { background: var(--red); color: #fff; }
        .btn-red:hover { background: var(--red-dark); color: #fff; }
        .btn-outline-w { background: transparent; border: 2px solid var(--white) !important; color: var(--white); }
        .btn-outline-w:hover { background: var(--white); color: var(--black); }

        /* Layout tài khoản */
        .account-wrapper {
            max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;
            display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem;
        }

        /* Sidebar menu */
        .account-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 1.5rem 0;
            height: fit-content; position: sticky; top: 80px;
        }
        .account-sidebar .user-info {
            padding: 0 1.2rem 1.2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: .75rem;
        }
        .account-sidebar .user-info .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--red); display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 900; color: #fff; margin-bottom: .5rem;
        }
        .account-sidebar .user-info .name { font-weight: 700; font-size: .95rem; color: var(--white); }
        .account-sidebar .user-info .email { font-size: .78rem; color: var(--gray); margin-top: .2rem; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: .75rem;
            padding: .65rem 1.2rem; font-size: .88rem; font-weight: 500;
            color: var(--gray); transition: .15s;
        }
        .sidebar-menu a:hover { color: var(--white); background: var(--hover); }
        .sidebar-menu a.active { color: var(--red); background: rgba(230,48,48,.08); border-left: 3px solid var(--red); }
        .sidebar-menu a i { width: 18px; text-align: center; }
        .sidebar-menu .divider { border-top: 1px solid var(--border); margin: .5rem 0; }

        /* Content area */
        .account-content { min-width: 0; }
        .account-content .page-title {
            font-size: 1.3rem; font-weight: 800; color: var(--white);
            margin-bottom: 1.25rem; padding-bottom: .75rem;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: .6rem;
        }
        .account-content .page-title .icon { color: var(--red); font-size: 1rem; }

        /* Alert */
        .cus-alert {
            padding: .85rem 1.2rem; border-radius: 8px; margin-bottom: 1rem;
            font-size: .9rem; display: flex; align-items: center; gap: .75rem;
        }
        .cus-alert-success { background: rgba(40,167,69,.15); border: 1px solid rgba(40,167,69,.3); color: #6fcf97; }
        .cus-alert-danger { background: rgba(230,48,48,.12); border: 1px solid rgba(230,48,48,.25); color: #ff8080; }

        /* Card */
        .cus-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
        }
        .cus-card-header {
            padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .cus-card-header h5 { font-weight: 700; color: var(--white); margin: 0; }
        .cus-card-body { padding: 1.25rem; }

        /* Table */
        .cus-table { width: 100%; border-collapse: collapse; }
        .cus-table th {
            background: #0d0d0d; color: var(--gray);
            font-size: .78rem; font-weight: 700; text-transform: uppercase;
            padding: .75rem 1rem; text-align: left; border-bottom: 1px solid var(--border);
        }
        .cus-table td { padding: .85rem 1rem; border-bottom: 1px solid var(--border); font-size: .9rem; }
        .cus-table tr:last-child td { border-bottom: none; }
        .cus-table tr:hover td { background: var(--hover); }

        /* Form */
        .cus-form-group { margin-bottom: 1.1rem; }
        .cus-label { display: block; font-size: .83rem; font-weight: 600; color: var(--gray); margin-bottom: .4rem; }
        .cus-label.required::after { content: ' *'; color: var(--red); }
        .cus-input {
            width: 100%; padding: .65rem 1rem; background: #1a1a1a;
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--white); font-size: .9rem; transition: .2s;
        }
        .cus-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 2px rgba(230,48,48,.15); }

        /* Badge */
        .cus-badge {
            display: inline-block; padding: .25rem .7rem; border-radius: 20px;
            font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
        }
        .cus-badge-success { background: rgba(40,167,69,.15); color: #6fcf97; border: 1px solid rgba(40,167,69,.3); }
        .cus-badge-danger { background: rgba(230,48,48,.12); color: #ff8080; border: 1px solid rgba(230,48,48,.25); }
        .cus-badge-warning { background: rgba(255,193,7,.12); color: #ffc107; border: 1px solid rgba(255,193,7,.25); }
        .cus-badge-info { background: rgba(54,164,235,.12); color: #36a4eb; border: 1px solid rgba(54,164,235,.25); }
        .cus-badge-secondary { background: rgba(136,136,136,.12); color: var(--gray); border: 1px solid rgba(136,136,136,.25); }

        /* Btn */
        .cus-btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .55rem 1.2rem; border-radius: 8px; font-size: .88rem;
            font-weight: 600; border: none; cursor: pointer; transition: .2s;
        }
        .cus-btn-primary { background: var(--red); color: #fff; }
        .cus-btn-primary:hover { background: var(--red-dark); color: #fff; }
        .cus-btn-secondary { background: #2a2a2a; color: var(--white); border: 1px solid var(--border); }
        .cus-btn-secondary:hover { background: #333; }
        .cus-btn-sm { padding: .35rem .85rem; font-size: .8rem; }

        /* Footer */
        .cus-footer {
            background: #111; border-top: 1px solid var(--border);
            padding: 1.5rem; text-align: center; color: var(--gray); font-size: .83rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .account-wrapper { grid-template-columns: 1fr; }
            .account-sidebar { position: static; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<header class="cus-navbar">
    <a href="/" class="brand">SKY<span>SPORT</span></a>
    <nav class="nav-links d-none d-md-flex">
        <a href="/">Trang chủ</a>
        <a href="/san-pham">Sản phẩm</a>
    </nav>
    <div class="nav-actions">
        <a href="/customer/orders" class="btn-outline-w">Đơn hàng</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-red">Đăng xuất</button>
        </form>
    </div>
</header>

<!-- Account layout -->
<div class="account-wrapper">

    <!-- Sidebar -->
    <aside class="account-sidebar">
        <div class="user-info">
            <div class="avatar" sec:authentication="name" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">U</div>
            <div class="name" sec:authentication="name">Tên người dùng</div>
            <div class="email" style="color:var(--gray);font-size:.75rem;">Khách hàng</div>
        </div>
        <nav class="sidebar-menu">
            <a th:href="@{/customer/orders}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/order') ? 'active' : ''}">
                <i class="fas fa-shopping-bag"></i> Đơn hàng của tôi
            </a>
            <a th:href="@{/customer/profile}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/profile/index') ? 'active' : ''}">
                <i class="fas fa-user"></i> Hồ sơ cá nhân
            </a>
            <a th:href="@{/customer/profile/change-password}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/profile/change') ? 'active' : ''}">
                <i class="fas fa-lock"></i> Đổi mật khẩu
            </a>
            <a th:href="@{/customer/wishlist}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/wishlist') ? 'active' : ''}">
                <i class="fas fa-heart"></i> Yêu thích
            </a>
            <a th:href="@{/customer/reviews}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/review') ? 'active' : ''}">
                <i class="fas fa-star"></i> Đánh giá của tôi
            </a>
            <a th:href="@{/customer/notifications}"
               th:classappend="${pageContent != null and pageContent.startsWith('customer/notification') ? 'active' : ''}">
                <i class="fas fa-bell"></i> Thông báo
            </a>
            <div class="divider"></div>
            <a href="/san-pham">
                <i class="fas fa-store"></i> Tiếp tục mua sắm
            </a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="account-content">
        <!-- Flash messages -->
        <div th:if="${success}" class="cus-alert cus-alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="cus-alert cus-alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Page content -->
        <div th:replace="~{${pageContent} :: content}"></div>
    </main>
</div>

<!-- Footer -->
<footer class="cus-footer">
    <p>© 2026 SkySport — Áo thể thao chính hãng</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
