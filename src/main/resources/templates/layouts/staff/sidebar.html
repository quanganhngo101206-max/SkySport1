<aside class="sidebar" id="sidebar" th:fragment="sidebar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <!-- Brand -->
    <div class="sidebar-brand">
        <div class="logo-icon">S</div>
        <div>
            <div class="logo-text">SKY<span>SPORT</span></div>
            <span class="logo-sub">Staff Portal</span>
        </div>
    </div>

    <!-- User Info -->
    <div class="sidebar-user">
        <div class="avatar">
            <span sec:authentication="name"
                  th:text="${#strings.substring(#authentication.getName(), 0, 1).toUpperCase()}">U</span>
            <span class="online-dot"></span>
        </div>
        <div class="user-info">
            <span class="name" sec:authentication="name">Staff</span>
            <span class="role">STAFF</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <div class="nav-label">Tổng quan</div>
        <li class="nav-item">
            <a th:href="@{/staff}" class="nav-link"
               th:classappend="${#strings.contains(pageContent, 'staff/dashboard')} ? 'active' : ''">
                <span class="icon"><i class="fas fa-th-large"></i></span>
                <span>Dashboard</span>
            </a>
        </li>

        <div class="nav-label">Quản lý</div>
        <li class="nav-item">
            <a th:href="@{/staff/orders}" class="nav-link"
               th:classappend="${#strings.contains(pageContent, 'staff/order')} ? 'active' : ''">
                <span class="icon"><i class="fas fa-file-invoice"></i></span>
                <span>Đơn hàng</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/staff/returns}" class="nav-link"
               th:classappend="${#strings.contains(pageContent, 'staff/return')} ? 'active' : ''">
                <span class="icon"><i class="fas fa-undo-alt"></i></span>
                <span>Hoàn trả</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/staff/imports}" class="nav-link"
               th:classappend="${#strings.contains(pageContent, 'staff/import')} ? 'active' : ''">
                <span class="icon"><i class="fas fa-truck-loading"></i></span>
                <span>Phiếu nhập</span>
            </a>
        </li>

        <div class="nav-label">Hệ thống</div>
        <li class="nav-item">
            <form th:action="@{/staff/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link" style="color:var(--primary);">
                    <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </li>
    </nav>
</aside>
