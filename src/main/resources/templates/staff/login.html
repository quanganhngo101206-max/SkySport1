<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - SkySport</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .login-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-container .logo h1 {
            font-size: 32px;
            font-weight: 900;
            color: #e63030;
            letter-spacing: -1px;
        }

        .login-container .logo h1 span {
            color: #ffffff;
        }

        .login-container .logo .sub {
            color: #6b6b6b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            display: block;
            margin-top: 4px;
        }

        .login-container .logo .badge-staff {
            display: inline-block;
            background: rgba(54, 164, 235, 0.15);
            color: #36a4eb;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 20px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-container .title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-container .subtitle {
            color: #6b6b6b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b6b6b;
            font-size: 16px;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 46px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: #e63030;
            box-shadow: 0 0 0 3px rgba(230, 48, 48, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #e63030;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #c82020;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(230, 48, 48, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
            color: #6b6b6b;
            font-size: 13px;
        }

        .back-link a {
            color: #6b6b6b;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #e63030;
        }

        .alert-sky {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-sky-danger {
            background: rgba(230, 48, 48, 0.1);
            border: 1px solid rgba(230, 48, 48, 0.2);
            color: #e63030;
        }

        .alert-sky-success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1>SKY<span>SPORT</span></h1>
        <span class="sub">Staff Portal</span>
        <span class="badge-staff"><i class="fas fa-user-tie"></i> Nhân viên</span>
    </div>

    <div class="title">Đăng nhập hệ thống</div>
    <div class="subtitle">Quản lý đơn hàng, hoàn trả và nhập kho</div>

    <div th:if="${error}" class="alert-sky alert-sky-danger">
        <span class="icon"><i class="fas fa-exclamation-circle"></i></span>
        <span th:text="${error}">Sai tên đăng nhập hoặc mật khẩu</span>
    </div>
    <div th:if="${message}" class="alert-sky alert-sky-success">
        <span class="icon"><i class="fas fa-check-circle"></i></span>
        <span th:text="${message}">Đăng xuất thành công</span>
    </div>

    <form th:action="@{/staff/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-user"></i></span>
                <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
                <span class="icon"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </button>
    </form>

    <div class="back-link">
        <a href="/"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
        <span style="color:#2a2a2a;margin:0 10px;">|</span>
        <a href="/admin/login">Đăng nhập Admin</a>
        <span style="color:#2a2a2a;margin:0 10px;">|</span>
        <a href="/login">Đăng nhập Khách hàng</a>
    </div>
</div>
</body>
</html>
