<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><title>Page</title></head>
<body>
<div th:fragment="content">

    <div class="row g-3">
        <div class="col-md-5">
            <div class="card-sky">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-id-badge icon"></i>
                        Thông tin cá nhân
                    </div>
                </div>
                <div class="card-body" th:if="${staff != null}">
                    <div class="mb-3">
                        <label class="form-sky-label">Họ tên</label>
                        <input type="text" class="form-sky" th:value="${staff.fullName}" disabled
                               style="opacity:.6; cursor:not-allowed;">
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Tên đăng nhập</label>
                        <input type="text" class="form-sky" th:value="${account != null ? account.username : ''}" disabled
                               style="opacity:.6; cursor:not-allowed;">
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Số điện thoại</label>
                        <input type="text" class="form-sky" th:value="${staff.phone}" disabled
                               style="opacity:.6; cursor:not-allowed;">
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Email</label>
                        <input type="text" class="form-sky" th:value="${staff.email}" disabled
                               style="opacity:.6; cursor:not-allowed;">
                    </div>
                    <div class="mb-3">
                        <label class="form-sky-label">Vai trò</label>
                        <input type="text" class="form-sky"
                               th:value="${account != null and account.role != null ? account.role.name : '-'}" disabled
                               style="opacity:.6; cursor:not-allowed;">
                    </div>
                    <small style="color:var(--text-muted); font-size:.8rem;">
                        Thông tin cá nhân do Admin quản lý. Liên hệ Admin nếu cần cập nhật.
                    </small>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card-sky">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-key icon"></i>
                        Đổi mật khẩu
                    </div>
                </div>
                <div class="card-body">
                    <form th:action="@{/staff/profile/change-password}" th:object="${changePasswordRequest}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-sky-label required">Mật khẩu hiện tại</label>
                            <input type="password" class="form-sky" th:field="*{currentPassword}" required>
                            <span class="text-danger" th:errors="*{currentPassword}"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label required">Mật khẩu mới</label>
                            <input type="password" class="form-sky" th:field="*{newPassword}" required>
                            <span class="text-danger" th:errors="*{newPassword}"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-sky-label required">Xác nhận mật khẩu mới</label>
                            <input type="password" class="form-sky" th:field="*{confirmPassword}" required>
                            <span class="text-danger" th:errors="*{confirmPassword}"></span>
                        </div>

                        <button type="submit" class="btn-sky btn-sky-primary">
                            <i class="fas fa-save"></i> Đổi mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
