<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SkySport Staff'">SkySport Staff</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-input: #f8f9fa;
            --primary: #e63030;
            --primary-dark: #c82020;
            --primary-light: #ff6b6b;
            --primary-gradient: linear-gradient(135deg, #e63030, #c82020);
            --bg-body: #0a0a0a;
            --bg-card: #141414;
            --bg-hover: #1e1e1e;
            --bg-sidebar: #0d0d0d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== GIỐNG ADMIN LAYOUT ===== */
        /* Copy toàn bộ CSS từ admin layout vào đây */
        /* ... (giữ nguyên style) ... */

        .staff-badge {
            display: inline-block;
            background: rgba(54, 164, 235, 0.15);
            color: #36a4eb;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<!-- SIDEBAR STAFF (tương tự admin nhưng menu khác) -->
<div th:replace="~{layouts/staff/sidebar :: sidebar}"></div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <!-- Top Navbar -->
    <nav class="top-navbar">
        <div class="left">
            <button class="toggle-btn" id="toggleSidebar">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <div class="page-title">
                    <span class="title-icon"><i class="fas fa-chevron-right"></i></span>
                    <span th:text="${title}">Dashboard</span>
                    <span class="staff-badge"><i class="fas fa-user-tie"></i> STAFF</span>
                </div>
            </div>
        </div>
        <div class="right">
            <form th:action="@{/staff/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-icon" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </form>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="content-area">
        <!-- Flash Messages -->
        <div th:if="${success}" class="alert-sky alert-sky-success">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert-sky alert-sky-danger">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Page Content -->
        <div th:replace="~{${pageContent} :: content}"></div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');
        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', function () {
                sidebar.classList.toggle('open');
            });
        }
    });
</script>
</body>
</html>
